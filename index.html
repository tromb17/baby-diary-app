<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9f3e3">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Дневник малыша</title>
<style>
/* Днём — светлый мятный градиент и размытые зверята на фоне (.zoo), карточки полупрозрачные.
   Тёмная тема телефона — ночное небо. Ночной режим — почти чёрный, без зверят. */
:root{
  --page:#eaf7ef; --bg:linear-gradient(165deg,#d9f3e3 0%,#eef9ee 30%,#fff5e3 68%,#e3f0fc 100%);
  --surface:rgba(255,255,255,.62); --solid:#ffffff; --surface-2:rgba(255,255,255,.55); --line:rgba(36,94,62,.12);
  --text:#14241b; --text-2:#45584c; --muted:#7c8d82;
  --accent:#2a9d68; --on-accent:#fff; --good:#1a9d5a; --warn:#d98a00; --bad:#d23f3f;
  --c-feed:#e0568f; --c-sleep:#6f5bd9; --c-diaper:#109aa8; --c-pump:#e8743a;
  --shadow:0 1px 2px rgba(20,60,40,.06),0 6px 20px rgba(20,60,40,.07); --r:20px; --zoo:.9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#10202a; --bg:linear-gradient(165deg,#0e2a25 0%,#132536 55%,#221a38 100%);
    --surface:rgba(24,34,44,.78); --solid:#18222c; --surface-2:rgba(38,52,64,.8); --line:rgba(255,255,255,.09);
    --text:#eef3ef; --text-2:#c2cdc6; --muted:#8a9a91;
    --accent:#4cc28c; --on-accent:#08170f; --good:#44c27f; --warn:#e9a93a; --bad:#ef7070;
    --c-feed:#ef7aa9; --c-sleep:#9d8cf2; --c-diaper:#2dbccb; --c-pump:#f28a58; --shadow:none; --zoo:.2;
  }
}
:root[data-theme="dark"]{
  --page:#10202a; --bg:linear-gradient(165deg,#0e2a25 0%,#132536 55%,#221a38 100%);
  --surface:rgba(24,34,44,.78); --solid:#18222c; --surface-2:rgba(38,52,64,.8); --line:rgba(255,255,255,.09);
  --text:#eef3ef; --text-2:#c2cdc6; --muted:#8a9a91;
  --accent:#4cc28c; --on-accent:#08170f; --good:#44c27f; --warn:#e9a93a; --bad:#ef7070;
  --c-feed:#ef7aa9; --c-sleep:#9d8cf2; --c-diaper:#2dbccb; --c-pump:#f28a58; --shadow:none; --zoo:.2;
}
/* ночной режим: почти чёрный экран, тёплый приглушённый текст, крупные кнопки */
:root[data-night]{
  --page:#070605; --bg:#070605; --surface:#110e0c; --solid:#110e0c; --surface-2:#1a1512; --line:#2a211b;
  --text:#d8a888; --text-2:#b48a6f; --muted:#7d6150;
  --accent:#b8805c; --on-accent:#140f0c; --good:#9a8a55; --warn:#c08a4a; --bad:#c06a5a;
  --c-feed:#b86a6a; --c-sleep:#8a74a8; --c-diaper:#6a8f8a; --c-pump:#b07a50; --shadow:none; --zoo:0;
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"],:root[data-night]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--page)}
body{background:var(--bg);background-attachment:fixed;min-height:100vh;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.zoo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--zoo);transition:opacity .4s}
.zoo svg{position:absolute;filter:blur(2.5px)}
.card.feed,.card.sleep,.card.diaper{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
:root[data-night] .card.feed,:root[data-night] .card.sleep,:root[data-night] .card.diaper{background:var(--surface)}
.top,main{position:relative;z-index:1}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#ffd9a8,#ffb3cf 50%,#b9c8ff);box-shadow:0 2px 8px rgba(0,0,0,.08)}
:root[data-night] .ava{background:#2a211b;box-shadow:none;filter:grayscale(.6) brightness(.7)}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;margin:0 6px}
.syncdot.ok{background:var(--good)} .syncdot.busy{background:var(--warn)} .syncdot.err,.syncdot.need{background:var(--bad)}
.syncbtn{border:0;background:transparent;padding:14px 4px;margin:-10px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 55%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
:root[data-night] .top{background:var(--page)}
.who{flex:1;min-width:0}
.who h1{font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age{font-size:13px;color:var(--muted)}
.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--accent);background:var(--surface-2)}

main{max-width:640px;margin:0 auto;padding:0 16px 24px}
.card{background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.st{font-size:14px;color:var(--text-2);margin:4px 0 10px}
.st b{color:var(--text);font-weight:600}
.st .warn{color:var(--warn);font-weight:600}
.feed{--c:var(--c-feed)} .sleep{--c:var(--c-sleep)} .diaper{--c:var(--c-diaper)} .pump{--c:var(--c-pump)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{flex:1 1 0;min-width:0;border:1px solid color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line));background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--surface));color:var(--text);border-radius:13px;padding:12px 8px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.b small{font-weight:500;font-size:11.5px;color:var(--c,var(--accent))}
.b:active{transform:scale(.97)}
.b.main{background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 72%,#ffb36b));border-color:transparent;color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
:root[data-night] .b.main{background:var(--c,var(--accent));box-shadow:none}
.b.main small{color:inherit;opacity:.85}
.b.ghost{background:transparent}
.b.wide{flex-basis:100%}
.b .e{font-size:20px;line-height:1}

.live{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.timer{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sides{display:flex;gap:16px;font-size:14px;color:var(--text-2);margin-bottom:12px}
.sides .cur{color:var(--c);font-weight:700}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum>div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0;border-top:3px solid var(--c)}
.sum .l{font-size:12px;color:var(--text-2)}
.sum .v{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .s{font-size:12px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent);padding:10px 0 0;font-size:14px;font-weight:600}

.daynav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.daynav h2{flex:1;margin:0;text-align:center;font-size:18px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:40px;font-size:20px;color:var(--text-2)}
.daynav button:disabled{opacity:.35}

.strip{position:relative;height:34px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.strip i{position:absolute;top:0;bottom:0;background:var(--c);opacity:.85}
.strip i.feed{top:55%;opacity:1;min-width:3px}
.strip i.diaper{top:auto;bottom:0;height:5px;width:5px;border-radius:50%;opacity:1;transform:translateX(-50%)}
.strip i.nowl{background:var(--text);width:1.5px;opacity:.6}
.strip-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.list li:first-child{border-top:0}
.list .tm{width:92px;flex:none;font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.list .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);font-size:17px}
.list .tx{flex:1;min-width:0}
.list .tx div{font-weight:600}
.list .tx small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:18px 0 8px;font-size:14px}

.adv h3{margin-bottom:6px}
.adv ul{margin:6px 0 0;padding-left:20px}
.adv li{margin:3px 0}
.adv .src{font-size:12px;color:var(--muted);margin-top:8px}
.adv.alarm{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.adv.alarm h3{color:var(--bad)}
table.norm{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.norm td,.norm th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.norm th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500}
.norm tr.me td{font-weight:700;color:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:600}

.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:relative;background:var(--solid);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;min-height:44px}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px}
.chk input{width:22px;height:22px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .b{flex:1}
.b.del{--c:var(--bad);background:transparent}
.err{color:var(--bad);font-size:13.5px;min-height:1px;margin:0 0 8px}
.sec-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--page);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px}


/* переключатель */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--solid);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* рост и вес */
.gnow .v{font-size:30px;font-weight:700}
.gnow .v small{font-size:15px;color:var(--muted);font-weight:500}
.gnow .s{font-size:13px;color:var(--muted)}
.pct{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:10px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pct.low,.pct.high{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.gchart{margin-top:10px}
.gchart svg{display:block;width:100%;height:auto}
.gchart .grid{stroke:var(--line)} .gchart .ax{fill:var(--muted);font-size:11px}
.gchart .b97{fill:color-mix(in srgb,var(--accent) 13%,transparent)} .gchart .b85{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.gchart .p50{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.gchart .today{stroke:var(--muted);stroke-dasharray:2 3}
.gchart .me{fill:none;stroke:var(--c-feed);stroke-width:2.5;stroke-linejoin:round}
.gchart .dot{fill:var(--c-feed);stroke:var(--solid);stroke-width:2}
/* прививки: обязательные — сплошные, группы риска — серые, по желанию — пунктир и свой цвет */
.vleg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.vtag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.vtag.all{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.vtag.risk{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.vtag.opt{color:var(--c-sleep);border:1.5px dashed color-mix(in srgb,var(--c-sleep) 60%,transparent);background:transparent}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.vdate{font-size:13px;color:var(--muted);white-space:nowrap}
.vgrp.now{border-color:color-mix(in srgb,var(--warn) 55%,transparent)} .vgrp.now .vdate{color:var(--warn);font-weight:600}
.vgrp.soon .vdate{color:var(--accent);font-weight:600}
.vgrp.done{opacity:.75} .vgrp.done .vdate{color:var(--good);font-weight:600}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vlist li{display:flex;align-items:center;gap:12px;padding:10px;margin-top:6px;border-radius:13px;cursor:pointer;background:var(--surface-2);border:1px solid transparent}
.vlist li.all{border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.vlist li.opt{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c-sleep) 45%,transparent)}
.vlist li.risk{background:transparent;border:1px solid var(--line)} .vlist li.risk .tx div{color:var(--text-2);font-weight:500}
.vlist .tx{flex:1;min-width:0} .vlist .tx div{font-weight:600} .vlist .tx small{color:var(--muted);font-size:12.5px;display:block}
.vchk{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.vlist li.ok .vchk,.vchk.on{background:var(--good);border-color:var(--good)}
.vlist li.ok .tx div{text-decoration:none;color:var(--text-2)}
/* вехи */
.mbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:12px 0 4px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc36b,var(--c-feed),var(--c-sleep));border-radius:99px}
.mlist li.late .tx small{color:var(--warn)}
.mlist li.next{opacity:.7}
.mlist .ic{--c:var(--accent)}
/* ночью — крупнее */
:root[data-night] body{font-size:17px}
:root[data-night] .b{padding:18px 8px;font-size:18px;border-radius:16px}
:root[data-night] .timer{font-size:56px}
:root[data-night] .card h3{font-size:18px}
</style>
</head>
<body>
<div class="zoo" aria-hidden="true">
  <!-- мишка -->
  <svg viewBox="0 0 100 100" style="width:150px;top:70px;right:-34px;transform:rotate(12deg)"><circle cx="22" cy="24" r="14" fill="#f1bf92"/><circle cx="78" cy="24" r="14" fill="#f1bf92"/><circle cx="50" cy="56" r="36" fill="#f4c9a0"/><ellipse cx="50" cy="68" rx="15" ry="12" fill="#fde6cf"/><circle cx="37" cy="50" r="3.5" fill="#9b6b48"/><circle cx="63" cy="50" r="3.5" fill="#9b6b48"/><ellipse cx="50" cy="63" rx="5" ry="3.5" fill="#9b6b48"/></svg>
  <!-- зайка -->
  <svg viewBox="0 0 100 130" style="width:110px;top:330px;left:-30px;transform:rotate(-14deg)"><ellipse cx="36" cy="30" rx="11" ry="30" fill="#f6bcd2"/><ellipse cx="64" cy="30" rx="11" ry="30" fill="#f6bcd2"/><ellipse cx="36" cy="32" rx="5" ry="20" fill="#fde0ea"/><ellipse cx="64" cy="32" rx="5" ry="20" fill="#fde0ea"/><circle cx="50" cy="86" r="32" fill="#f7c6d9"/><circle cx="39" cy="82" r="3.5" fill="#a5577a"/><circle cx="61" cy="82" r="3.5" fill="#a5577a"/><ellipse cx="50" cy="93" rx="4" ry="3" fill="#e27aa3"/></svg>
  <!-- утёнок -->
  <svg viewBox="0 0 120 100" style="width:140px;bottom:120px;left:6%;transform:rotate(6deg)"><ellipse cx="70" cy="68" rx="40" ry="24" fill="#ffe08a"/><circle cx="40" cy="38" r="20" fill="#ffe59c"/><ellipse cx="19" cy="42" rx="11" ry="6" fill="#ffad5c"/><circle cx="37" cy="33" r="3.5" fill="#7a5a1c"/><path d="M75 55q14-8 26 4q-12 6-26-4z" fill="#ffd36a"/></svg>
  <!-- слонёнок -->
  <svg viewBox="0 0 110 100" style="width:150px;bottom:150px;right:-26px;transform:rotate(-8deg)"><circle cx="22" cy="46" r="22" fill="#a9c6ee"/><circle cx="88" cy="46" r="22" fill="#a9c6ee"/><circle cx="55" cy="48" r="30" fill="#b9d3f2"/><path d="M48 62q-2 26 12 30q6 1 6-5q-8-2-7-25z" fill="#b9d3f2"/><circle cx="44" cy="44" r="3.5" fill="#4e6a92"/><circle cx="66" cy="44" r="3.5" fill="#4e6a92"/></svg>
  <!-- котёнок -->
  <svg viewBox="0 0 100 100" style="width:96px;top:560px;right:12%;transform:rotate(10deg)"><path d="M18 40L22 8L44 26z" fill="#c6e6a6"/><path d="M82 40L78 8L56 26z" fill="#c6e6a6"/><circle cx="50" cy="56" r="34" fill="#cfe8b0"/><circle cx="38" cy="52" r="3.5" fill="#5d7d3c"/><circle cx="62" cy="52" r="3.5" fill="#5d7d3c"/><path d="M46 62h8l-4 4z" fill="#e48aa8"/></svg>
  <!-- китёнок -->

<header class="top">

<main id="view"></main>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ───────── хранение ─────────
   Всё лежит в localStorage. Каждая запись — событие {id, t, s, e, …, by, u, del}:
   id — уникальный, u — время последней правки, del — удалено (не стираем сразу, чтобы потом
   правильно объединять дневники двух родителей: по id побеждает более свежая правка, mergeEvents). */
const KEY = 'babydiary.v1', DEVKEY = 'babydiary.dev', NIGHTKEY = 'babydiary.night.v1', LASTKEY = 'babydiary.last.v1';
const DEL_DAYS = 30;
const $ = s => document.querySelector(s);
const now = () => Date.now() + (window.__shift || 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsJson(k, d) { try { return JSON.parse(lsGet(k)) || d; } catch (e) { return d; } }
const DEV = lsGet(DEVKEY) || (() => { const d = uid(); lsSet(DEVKEY, d); return d; })();

/* Кроме событий в общий дневник уходят ещё две записи того же вида: 'baby' (имя, дата рождения)
   и 'dev:<устройство>' (как зовут родителя — «Мама», «Папа»). Всё объединяется одинаково: по id, свежее u. */
function normalize(s) {
  if (!s || typeof s !== 'object') s = {};
  s.v = 1;
  s.baby = Object.assign({ name: '', birth: '', sex: '', u: 0 }, s.baby || {});
  s.devs = s.devs && typeof s.devs === 'object' ? s.devs : {};
  const old = now() - DEL_DAYS * 864e5;
  s.events = (Array.isArray(s.events) ? s.events : []).filter(e => e && e.id && e.t && isFinite(e.s) && !(e.del && e.u < old));
  return s;
}
function load() { return normalize(lsJson(KEY, null)); }
function save() { lsSet(KEY, JSON.stringify(S)); }
let S = load();

// очередь на отправку в таблицу: {id: u}. Пишем всегда — при входе в Google уйдёт всё, что накопилось.
const OUTKEY = 'babydiary.out.v1';
function mark(id, u) { const o = lsJson(OUTKEY, {}); o[id] = u; lsSet(OUTKEY, JSON.stringify(o)); if (typeof schedulePush === 'function') schedulePush(); }

const evs = () => S.events.filter(e => !e.del);
const byStart = (a, b) => b.s - a.s;
const activeOf = t => evs().find(e => e.t === t && e.e == null);
const lastOf = (t, f) => evs().filter(e => e.t === t && (!f || f(e))).sort(byStart)[0];
const evById = id => S.events.find(e => e.id === id);
function add(o) { const e = Object.assign({ id: uid(), by: DEV, u: now() }, o); S.events.push(e); save(); mark(e.id, e.u); return e; }
function upd(e, p) { e = evById(e.id) || e; Object.assign(e, p, { u: now() }); save(); mark(e.id, e.u); return e; }
function setBaby(p) { Object.assign(S.baby, p, { u: now() }); save(); mark('baby', S.baby.u); }
function setMe(p) { S.devs[DEV] = Object.assign({ name: '', email: '' }, S.devs[DEV], p, { u: now() }); save(); mark('dev:' + DEV, S.devs[DEV].u); }
const devName = id => (S.devs[id] || {}).name || '';
function mergeEvents(a, b) {
  const m = new Map();
  for (const e of [...a, ...b]) { const o = m.get(e.id); if (!o || (e.u || 0) > (o.u || 0)) m.set(e.id, e); }
  return [...m.values()];
}

/* ───────── время и слова ───────── */
const pad = n => String(n).padStart(2, '0');
function pl(n, a, b, c) { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; }
function hm(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMin(ms) { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + ' мин'; const h = Math.floor(m / 60), r = m % 60; return h + ' ч' + (r ? ' ' + r + ' мин' : ''); }
function fmtTimer(ms) { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); }
function fmtAgo(ts) { const ms = now() - ts; return ms < 60000 ? 'только что' : fmtMin(ms) + ' назад'; }
function sod(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return +d; }
function addDays(ts, n) { const d = new Date(ts); d.setDate(d.getDate() + n); return +d; }
function toInput(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fromInput(v) { if (!v) return null; const t = +new Date(v); return isFinite(t) ? t : null; }
function parseDay(v) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(v || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
function dayTitle(ts) {
  const t = sod(now()), d = new Date(ts);
  const base = d.getDate() + ' ' + MONTHS[d.getMonth()];
  return ts === t ? 'Сегодня, ' + base : ts === addDays(t, -1) ? 'Вчера, ' + base : base + ', ' + WD[d.getDay()];
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────── возраст и ориентиры ───────── */
function age() {
  const b = parseDay(S.baby.birth); if (!b) return null;
  const d = new Date(now()), total = Math.round((sod(+d) - +b) / 864e5);
  if (total < 0) return { total, m: 0, days: 0 };
  let m = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth();
  const mAt = k => { const y = b.getFullYear(), mo = b.getMonth() + k, dim = new Date(y, mo + 1, 0).getDate(); return new Date(y, mo, Math.min(b.getDate(), dim)); };
  if (mAt(m) > d) m--;
  return { total, m, days: Math.round((sod(+d) - +mAt(m)) / 864e5) };
}
function ageText() {
  const a = age(); if (!a) return '';
  if (a.total < 0) return 'ещё не родился';
  if (a.m < 1) return a.total + ' ' + pl(a.total, 'день', 'дня', 'дней');
  if (a.m >= 12) { const y = Math.floor(a.m / 12), r = a.m % 12; return y + ' ' + pl(y, 'год', 'года', 'лет') + (r ? ' ' + r + ' мес.' : ''); }
  return a.m + ' мес.' + (a.days ? ' ' + a.days + ' дн.' : '');
}
// Время бодрствования: ориентир по возрасту (до N месяцев). Единых норм в исследованиях нет — это распространённые рекомендации.
const WAKE = [[1, '40–60 мин', 40, 60], [2, '1–1,5 ч', 60, 90], [4, '1¼–2 ч', 75, 120], [6, '2–2,5 ч', 120, 150], [9, '2,5–3 ч', 150, 180], [12, '3–4 ч', 180, 240]];
// Сон за сутки: до 4 мес. — 14–17 ч (National Sleep Foundation), 4–12 мес. — 12–16 ч (AASM, одобрено AAP).
const SLEEP = [[4, '14–17 ч', 14, 17], [12, '12–16 ч', 12, 16]];
const pick = (tab, m) => tab.find(r => m < r[0]) || tab[tab.length - 1];
const ageM = () => { const a = age(); return a && a.total >= 0 ? a.m : null; };

/* ───────── кормление ───────── */
const SIDE = { L: 'Левая', R: 'Правая' }, SIDE1 = { L: 'Л', R: 'П' };
const other = s => s === 'L' ? 'R' : 'L';
function segsDur(e, side) { let t = 0; for (const g of e.segs || []) if (!side || g.side === side) t += (g.e ?? now()) - g.s; return t; }
const openSeg = e => { const g = (e.segs || [])[(e.segs || []).length - 1]; return g && g.e == null ? g : null; };
function lastSide() { const f = lastOf('feed', e => e.kind === 'breast' && (e.segs || []).length); return f ? f.segs[f.segs.length - 1].side : null; }
function nextSide() { const s = lastSide(); return s ? other(s) : null; }

function breast(side) {
  const t = now(); const f = activeOf('feed');
  if (f && f.kind === 'breast') {
    const g = openSeg(f); if (g && g.side === side) return;
    if (g) g.e = t;
    f.segs.push({ side, s: t, e: null }); upd(f, {});
  } else {
    if (f) upd(f, { e: t });
    add({ t: 'feed', kind: 'breast', s: t, e: null, segs: [{ side, s: t, e: null }] });
  }
  buzz(); render();
}
function pauseFeed() { const f = activeOf('feed'), g = f && openSeg(f); if (g) { g.e = now(); upd(f, {}); render(); } }
function stopFeed() {
  const f = activeOf('feed'); if (!f) return;
  const t = now(), g = openSeg(f); if (g) g.e = t;
  upd(f, { e: t }); buzz();
  toast('Кормление записано: ' + fmtMin(segsDur(f)), { label: 'Изменить', fn: () => editEvent(f.id) });
  render();
}

/* ───────── сон и подгузник ───────── */
function toggleSleep() {
  const a = activeOf('sleep'), t = now();
  if (a) { upd(a, { e: t }); toast('Сон записан: ' + fmtMin(t - a.s), { label: 'Изменить', fn: () => editEvent(a.id) }); }
  else add({ t: 'sleep', s: t, e: null });
  buzz(); render();
}
function diaper(k) {
  const t = now(), e = add({ t: 'diaper', s: t, e: t, wet: k !== 'dirty', dirty: k !== 'wet' });
  buzz(); toast(diaperTxt(e) + ' — записано', { label: 'Отменить', fn: () => { upd(e, { del: true }); render(); } });
  render();
}
const diaperTxt = e => 'Подгузник: ' + (e.wet && e.dirty ? 'мокрый и грязный' : e.dirty ? 'грязный' : 'мокрый');
function lastAwake() { if (activeOf('sleep')) return null; const s = lastOf('sleep', e => e.e != null); return s ? s.e : null; }

/* ───────── отклик ───────── */
function buzz() { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} }
let toastT;
function toast(text, act) {
  const el = $('#toast'); clearTimeout(toastT);
  el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button>' + esc(act.label) + '</button>' : '');
  if (act) el.querySelector('button').onclick = () => { el.hidden = true; act.fn(); };
  el.hidden = false; toastT = setTimeout(() => el.hidden = true, 4500);
}

/* ───────── ночной режим ─────────
   По расписанию (auto, from–to, можно через полночь) и кнопкой-луной в шапке. Кнопка действует до ближайшей
   смены по расписанию (без расписания — 12 часов). Настройка на устройстве, не в дневнике. */
function nightPref() { return Object.assign({ auto: false, from: '22:00', to: '07:00' }, lsJson(NIGHTKEY, {})); }
const hhmm = v => { const m = /^(\d\d?):(\d\d)$/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null; };
function bySchedule(p, ts) {
  const f = hhmm(p.from), t = hhmm(p.to); if (!p.auto || f == null || t == null || f === t) return false;
  const d = new Date(ts), m = d.getHours() * 60 + d.getMinutes();
  return f < t ? m >= f && m < t : m >= f || m < t;
}
function isNight() {
  const p = nightPref(), t = now();
  if (p.force && t - p.at < 12 * 3600e3 && bySchedule(p, p.at) === bySchedule(p, t)) return p.force === 'on';
  return bySchedule(p, t);
}
function toggleNight() { const p = nightPref(); p.force = isNight() ? 'off' : 'on'; p.at = now(); lsSet(NIGHTKEY, JSON.stringify(p)); applyNight(); }
const darkOS = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
function applyNight() {
  const on = isNight();
  if (on) document.documentElement.setAttribute('data-night', ''); else document.documentElement.removeAttribute('data-night');
  $('#nightBtn').classList.toggle('on', on);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = on ? '#070605' : darkOS() ? '#0e2a25' : '#d9f3e3';
}

/* ───────── экраны ───────── */
const UI = { tab: 'now', day: null, health: 'growth', gkind: 'w' };
const TABS = [
  ['now', 'Сейчас', '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ['day', 'День', '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/>'],
  ['health', 'Здоровье', '<path d="M12 21s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.5-9.3 9-9.3 9z"/><path d="M8 12h2l1-2 2 4 1-2h2"/>'],
  ['dev', 'Развитие', '<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/>'],
  ['tips', 'Советы', '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/>'],
];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, t, p]) => `<button class="${UI.tab === id ? 'on' : ''}" onclick="go('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${t}</button>`).join('');
}
function go(tab) { UI.tab = tab; if (tab === 'day') UI.day = sod(now()); render(); window.scrollTo(0, 0); }

function render() {
  applyNight();
  $('#bName').textContent = S.baby.name ? S.baby.name : 'Дневник малыша';
  $('#bAge').textContent = ageText();
  syncShow();
  renderTabs();
  const v = $('#view');
  v.innerHTML = UI.tab === 'day' ? viewDay() : UI.tab === 'tips' ? viewTips() : UI.tab === 'health' ? viewHealth() : UI.tab === 'dev' ? viewMiles() : viewNow();
  tick();
}

// живые цифры: data-base (уже набежало, мс) + data-from (идёт с …); data-ago — «… назад»
function tick() {
  const t = now();
  for (const el of document.querySelectorAll('[data-from]')) el.textContent = fmtTimer(+(el.dataset.base || 0) + (el.dataset.from ? t - +el.dataset.from : 0));
  for (const el of document.querySelectorAll('[data-ago]')) el.textContent = fmtAgo(+el.dataset.ago);
}

function viewNow() {
  let h = '';
  if (!S.baby.birth) h += welcomeCard();
  const f = activeOf('feed'), sl = activeOf('sleep');
  if (f) h += liveFeed(f);
  if (sl) h += `<div class="card sleep live"><h3><span class="dot"></span>Спит</h3>
    <div class="timer" data-from="${sl.s}"></div><div class="st">уснул в ${hm(sl.s)}</div>
    <div class="btns"><button class="b main" onclick="toggleSleep()"><span class="e">☀️</span>Проснулся</button></div></div>`;

  // кормление
  if (!f) {
    const lf = lastOf('feed'), ns = nextSide();
    const st = lf ? `Последнее — <b data-ago="${lf.s}"></b>, в ${hm(lf.s)}${lf.kind === 'breast' && lf.segs ? ' (' + feedSides(lf) + ')' : ''}` : 'Пока нет записей';
    h += `<div class="card feed"><h3><span class="dot"></span>Кормление</h3><div class="st">${st}</div>
      <div class="btns">
        ${['L', 'R'].map(s => `<button class="b ${ns === s ? 'main' : ''}" onclick="breast('${s}')">${SIDE[s]}<small>${ns === s ? 'следующая' : 'грудь'}</small></button>`).join('')}
        <button class="b" onclick="openBottle()"><span class="e">🍼</span><small>бутылочка</small></button>
      </div></div>`;
  }
  // сон
  if (!sl) {
    const aw = lastAwake(), m = ageM(), w = m != null ? pick(WAKE, m) : null;
    let st = 'Пока нет записей';
    if (aw) {
      const mins = (now() - aw) / 60000;
      st = `Проснулся в ${hm(aw)}, не спит уже <b>${fmtMin(now() - aw)}</b>`;
      if (w) st += mins > w[3] ? `<br><span class="warn">Пора укладывать</span> — ориентир для возраста ${w[1]}` : `<br>Ориентир бодрствования: ${w[1]}`;
    }
    h += `<div class="card sleep"><h3><span class="dot"></span>Сон</h3><div class="st">${st}</div>
      <div class="btns"><button class="b main" onclick="toggleSleep()"><span class="e">🌙</span>Уснул</button></div></div>`;
  }
  // подгузник
  const ld = lastOf('diaper');
  h += `<div class="card diaper"><h3><span class="dot"></span>Подгузник</h3><div class="st">${ld ? `Меняли <b data-ago="${ld.s}"></b> — ${diaperTxt(ld).slice(11)}` : 'Пока нет записей'}</div>
    <div class="btns">
      <button class="b" onclick="diaper('wet')"><span class="e">💧</span>Мокрый</button>

let REMOTE = lsJson(RKEY, null), GTOK = lsJson(GTOK_KEY, null), GAUTH_RET = null, gsAutoUntil = 0;
const gOK = () => !!window.__gtest || (!!G_CLIENT && location.protocol === 'https:');
const gRedirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
const tokOk = () => !!(GTOK && GTOK.exp > Date.now() + 60000);
function gsSetTok(t, sec) { GTOK = { t, exp: Date.now() + sec * 1000 }; lsSet(GTOK_KEY, JSON.stringify(GTOK)); }
function gsDropTok() { GTOK = null; try { localStorage.removeItem(GTOK_KEY); } catch (e) {} }
// вернулись со страницы входа Google: #access_token=…&expires_in=…&state=… или #error=…
(function () {
  const h = location.hash; if (!/^#.*\b(access_token|error)=/.test(h)) return;
  const p = new URLSearchParams(h.slice(1)), st = lsJson(GAUTH_KEY, null);
  try { localStorage.removeItem(GAUTH_KEY); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  if (!st || p.get('state') !== st.n) return;
  if (p.get('access_token')) { gsSetTok(p.get('access_token'), +p.get('expires_in') || 3600); GAUTH_RET = { ok: true, first: st.first, join: st.join }; }
  else GAUTH_RET = { err: p.get('error') || 'ошибка', first: st.first, join: st.join };
})();
function gsNeed() { const e = new Error('нужно снова войти в Google'); e.need = true; return e; }
// переход на страницу входа Google (страница перезагрузится; всё уже лежит на устройстве)
function gsRedirect(o) {
  const n = uid();
  lsSet(GAUTH_KEY, JSON.stringify({ n, first: !!o.first, join: o.join || '' }));
  if (!o.interactive) lsSet(GAUTO_KEY, String(Date.now()));
  const q = new URLSearchParams({ client_id: G_CLIENT, redirect_uri: gRedirectUri(), response_type: 'token', scope: G_SCOPE, state: n, include_granted_scopes: 'true' });
  if (o.first) q.set('prompt', 'select_account'); else if (!o.interactive) q.set('prompt', 'none');
  if (!o.first && REMOTE && REMOTE.email) q.set('login_hint', REMOTE.email);
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + q);
  return new Promise(() => {});
}
// молча продлевать вход можно сразу после открытия (или возвращения в приложение), не чаще раза в минуту
function gsAutoOk() { return Date.now() < gsAutoUntil && $('#sheetWrap').hidden && Date.now() - (+lsGet(GAUTO_KEY) || 0) > 60000; }
function gsAuth(interactive) {
  if (tokOk()) return Promise.resolve(GTOK.t);
  if (window.__gtest) return Promise.reject(gsNeed());
  if (interactive || gsAutoOk()) return gsRedirect({ interactive });
  return Promise.reject(gsNeed());
}
async function gsApi(url, o = {}, again) {
  const tok = await gsAuth(false);
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 45000);
  let r;
  try {
    r = await fetch(/^https:/.test(url) ? url : SHEETS_API + '/' + REMOTE.sheet + url, { method: o.method || 'GET', signal: ctl.signal, cache: 'no-store',
      headers: Object.assign({ Authorization: 'Bearer ' + tok }, o.body ? { 'Content-Type': 'application/json' } : {}), body: o.body ? JSON.stringify(o.body) : undefined });
  } catch (e) { const x = new Error(e && e.name === 'AbortError' ? 'Google не ответил' : 'нет связи'); x.net = true; throw x; }
  finally { clearTimeout(tm); }
  if (r.status === 401 && !again) { gsDropTok(); return gsApi(url, o, true); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j && j.error && j.error.message || 'Google ответил ошибкой ' + r.status); e.status = r.status; throw e; }
  return j || {};
}

// записи для таблицы: события + 'baby' + 'dev:<устройство>'
function recOf(id) {
  if (id === 'baby') return { id, t: 'baby', name: S.baby.name, birth: S.baby.birth, sex: S.baby.sex || '', u: S.baby.u || 0 };
  if (id.startsWith('dev:')) { const d = S.devs[id.slice(4)]; return d ? Object.assign({ id, t: 'dev' }, d) : null; }
  return evById(id) || null;
}
const allIds = () => ['baby', ...Object.keys(S.devs).map(k => 'dev:' + k), ...S.events.map(e => e.id)];
const dRu = ts => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + hm(ts); };
function rowOf(r) {
  const data = Object.assign({}, r); delete data.id; delete data.u;
  let when = '', what = '', who = '';
  if (r.t === 'baby') what = 'Малыш: ' + (r.name || '') + (r.birth ? ', родился ' + r.birth.split('-').reverse().join('.') : '');
  else if (r.t === 'dev') what = 'Родитель: ' + (r.name || '—') + (r.email ? ' (' + r.email + ')' : '');
  else { const i = evInfo(r); when = dRu(r.s); what = (r.del ? '[удалено] ' : '') + i.tx + (i.sub ? ' — ' + i.sub : '') + (r.note ? ' — ' + r.note : ''); who = devName(r.by); }
  return [r.id, r.u || 0, JSON.stringify(data), when, what, who];
}
function parseRows(rows) {
  const m = new Map();
  for (const row of rows || []) {
    const id = String(row[0] || ''); if (!id) continue;
    let r; try { r = JSON.parse(row[2]); } catch (e) { continue; }
    if (!r || typeof r !== 'object') continue;
    r.id = id; r.u = +row[1] || 0;
    const o = m.get(id); if (!o || r.u >= o.u) m.set(id, r);
  }
  return m;
}
// применить записи из таблицы: по id побеждает более свежая. true — что-то поменялось
function applyRemote(list) {
  let ch = false; const old = now() - DEL_DAYS * 864e5;
  for (const r of list) {
    if (!r || !r.id || !r.t) continue;
    if (r.t === 'baby') { if ((r.u || 0) > (S.baby.u || 0)) { S.baby = { name: r.name || '', birth: r.birth || '', sex: r.sex || '', u: r.u }; ch = true; } continue; }
    if (r.t === 'dev') { const k = r.id.slice(4), o = S.devs[k]; if (!o || (r.u || 0) > (o.u || 0)) { S.devs[k] = { name: r.name || '', email: r.email || '', u: r.u }; ch = true; } continue; }
    if (!isFinite(r.s) || (r.del && r.u < old)) continue;
    const i = S.events.findIndex(e => e.id === r.id);
    if (i < 0) { if (!r.del) { S.events.push(r); ch = true; } }
    else if ((r.u || 0) > (S.events[i].u || 0)) { S.events[i] = r; ch = true; }
  }
  if (ch) save();
  return ch;
}

const SYNC = { st: 'off', msg: '', busy: null, again: false, timer: null };
function setSync(st, msg) { SYNC.st = st; SYNC.msg = msg || ''; syncShow(); }
function syncShow() { const b = $('#syncBtn'); if (!b) return; b.hidden = !REMOTE; $('#syncDot').className = 'syncdot ' + SYNC.st; }
function syncInfo() {
  const t = { ok: 'Дневник сохранён в Google', busy: 'Сохраняю в Google…', pending: 'Нет связи — записи на телефоне, отправлю позже',
    err: SYNC.msg || 'Ошибка связи с Google', need: 'Нужно снова войти в Google — записи сохранены на телефоне' }[SYNC.st] || 'Подключаюсь к Google…';
  toast(t, SYNC.st === 'need' ? { label: 'Войти', fn: () => gsAuth(true) } : null);
}
function schedulePush() { if (!REMOTE) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(sync, 1500); }
async function sync() {
  if (!REMOTE) return;
  if (SYNC.busy) { SYNC.again = true; return SYNC.busy; }
  SYNC.busy = (async () => {
    setSync('busy');
    try {
      await push();
      const ch = await pull();
      setSync('ok');
      if (ch && $('#sheetWrap').hidden) render();
    } catch (e) { setSync(e.need ? 'need' : e.net ? 'pending' : 'err', e.need || e.net ? '' : 'Google: ' + e.message); }
  })();
  await SYNC.busy; SYNC.busy = null;
  if (SYNC.again) { SYNC.again = false; return sync(); }
}
async function push() {
  const out = lsJson(OUTKEY, {}), ids = Object.keys(out); if (!ids.length) return;
  const rows = ids.map(recOf).filter(r => r && !(r.t === 'baby' && !r.u)).map(rowOf);
  if (rows.length) await gsApi('/values/' + encodeURIComponent(GS_TAB + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: { values: rows } });
  const cur = lsJson(OUTKEY, {}); for (const id of ids) if (cur[id] === out[id]) delete cur[id]; lsSet(OUTKEY, JSON.stringify(cur));
}
async function pull() {
  const r = await gsApi('/values/' + encodeURIComponent(GS_TAB + '!A2:C') + '?valueRenderOption=UNFORMATTED_VALUE');
  const rows = r.values || [], m = parseRows(rows), ch = applyRemote([...m.values()]);
  if (rows.length > 2 * m.size + 300) await compact(rows.length, m).catch(() => {});
  return ch;
}
// сжатие: вставить последние версии сверху, затем удалить n прочитанных строк (всё одним пакетом)
async function compact(n, m) {
  const meta = await gsApi('?fields=sheets.properties(sheetId,title)');
  const sh = (meta.sheets || []).map(s => s.properties).find(p => p.title === GS_TAB); if (!sh) return;
  const old = now() - DEL_DAYS * 864e5;
  const rows = [...m.values()].filter(r => !(r.del && r.u < old)).map(rowOf)
    .map(v => ({ values: v.map(x => ({ userEnteredValue: typeof x === 'number' ? { numberValue: x } : { stringValue: String(x) } })) }));
  if (!rows.length) return;
  const k = rows.length, id = sh.sheetId;
  await gsApi(':batchUpdate', { method: 'POST', body: { requests: [
    { insertDimension: { range: { sheetId: id, dimension: 'ROWS', startIndex: 1, endIndex: 1 + k } } },
    { updateCells: { start: { sheetId: id, rowIndex: 1, columnIndex: 0 }, rows, fields: 'userEnteredValue' } },
    { deleteDimension: { range: { sheetId: id, dimension: 'ROWS', startIndex: 1 + k, endIndex: 1 + k + n } } }] } });
}

function gsLogin() { if (window.__gtest) return gsSetup(); gsRedirect({ interactive: true, first: true }); }
// первый вход: своя таблица (созданная приложением раньше или выбранная в окне Google) — или новая
async function gsSetup() {
  setSync('busy');
  const q = "name='" + GS_TITLE + "' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false";
  const f = (await gsApi(DRIVE_API + '?q=' + encodeURIComponent(q) + '&spaces=drive&orderBy=createdTime&fields=files(id)')).files || [];
  let id = f[0] && f[0].id, made = false;
  if (!id) { id = await gsCreate(); made = true; }
  await connect(id, made ? 'Готово: дневник сохраняется в таблицу «' + GS_TITLE + '» на вашем Google Диске' : 'Вход выполнен — дневник из вашей таблицы «' + GS_TITLE + '»');
}
async function gsCreate() {
  let tz = 'Europe/Moscow'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  const head = { values: GS_HEAD.map(h => ({ userEnteredValue: { stringValue: h }, userEnteredFormat: { textFormat: { bold: true } } })) };
  const r = await gsApi(SHEETS_API, { method: 'POST', body: { properties: { title: GS_TITLE, locale: 'ru_RU', timeZone: tz },
    sheets: [{ properties: { title: GS_TAB, gridProperties: { frozenRowCount: 1 } }, data: [{ startRow: 0, startColumn: 0, rowData: [head] }] }] } });
  return r.spreadsheetId;
}
async function connect(id, msg) {
  const u = await gsApi('https://openidconnect.googleapis.com/v1/userinfo');
  REMOTE = { sheet: id, email: u.email || '' }; lsSet(RKEY, JSON.stringify(REMOTE));
  if (u.email && (S.devs[DEV] || {}).email !== u.email) setMe({ email: u.email });
  // всё, что есть на устройстве, — в очередь (повторы не страшны: читается последняя версия)
  const o = lsJson(OUTKEY, {}); for (const k of allIds()) { const r = recOf(k); if (r) o[k] = r.u; } lsSet(OUTKEY, JSON.stringify(o));
  closeSheet(); await sync(); render();
  if (msg) toast(msg);
}
function openJoin(id) {
  openSheet(`<h2>👪 Общий дневник</h2><p style="color:var(--text-2);margin:0">Вас пригласили вести дневник малыша вместе. Войдите через Google тем аккаунтом, на который пришло приглашение, и выберите таблицу «${GS_TITLE}».</p>
    <p class="hint" style="margin-top:10px">Записи, которые уже есть на этом телефоне, добавятся в общий дневник.</p>
    <div class="acts" style="margin-top:16px"><button class="b ghost" onclick="closeSheet()">Позже</button><button class="b main" onclick="gsJoin('${esc(id)}')">Войти через Google</button></div>`);
}
async function gsJoin(id) {
  if (!tokOk() && !window.__gtest) return gsRedirect({ interactive: true, first: true, join: id || '-' });
  try {
    const picked = await pickSheet(id && id !== '-' ? id : '');
    if (!picked) return;
    await connect(picked, 'Готово: теперь у вас общий дневник');
  } catch (e) { setSync(REMOTE ? 'err' : 'off'); toast('Не удалось открыть общий дневник: ' + e.message); }
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('нет связи')); document.head.appendChild(s); }); }
// окно Google «выберите таблицу»: выбор даёт приложению доступ к чужой (приглашённой) таблице
async function pickSheet(id) {
  if (!G_API_KEY) throw new Error('окно выбора таблицы ещё не настроено');
  const tok = await gsAuth(false);
  if (!window.gapi) await loadScript('https://apis.google.com/js/api.js');
  await new Promise(r => gapi.load('picker', r));
  const P = google.picker;
  closeSheet();
  return new Promise(res => {
    const v = new P.DocsView(P.ViewId.SPREADSHEETS).setMode(P.DocsViewMode.LIST);
    if (id) v.setFileIds(id); else v.setQuery(GS_TITLE);
    new P.PickerBuilder().addView(v).setOAuthToken(tok).setDeveloperKey(G_API_KEY).setAppId(G_APP_ID).setLocale('ru')
      .setTitle('Выберите таблицу «' + GS_TITLE + '»')
      .setCallback(d => { if (d.action === P.Action.PICKED) res(d.docs[0].id); else if (d.action === P.Action.CANCEL) res(null); })
      .build().setVisible(true);
  });
}
const joinLink = () => gRedirectUri() + '?join=' + encodeURIComponent(REMOTE.sheet);
async function invite() {
  const em = $('#s_inv').value.trim(), err = m => { $('#s_ierr').textContent = m; };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return err('Проверьте адрес почты');
  if (em.toLowerCase() === (REMOTE.email || '').toLowerCase()) return err('Это ваш адрес — нужен адрес второго родителя');
  err(''); $('#s_invb').disabled = true;
  try {
    const msg = 'Давай вести дневник малыша вместе! Открой ссылку и войди через Google: ' + joinLink();
    await gsApi(DRIVE_API + '/' + REMOTE.sheet + '/permissions?sendNotificationEmail=true&fields=id&emailMessage=' + encodeURIComponent(msg),
      { method: 'POST', body: { role: 'writer', type: 'user', emailAddress: em } });
    $('#s_inv').value = ''; toast('Приглашение отправлено на ' + em);
  } catch (e) { err('Не получилось: ' + e.message); }
  finally { const b = $('#s_invb'); if (b) b.disabled = false; }
}
function shareLink() {
  const l = joinLink();
  if (navigator.share) navigator.share({ title: 'Дневник малыша', text: 'Присоединяйся к дневнику малыша', url: l }).catch(() => {});
  else { try { navigator.clipboard.writeText(l); } catch (e) {} toast('Ссылка скопирована'); }
}
function gsLogout() {
  if (!confirm('Выйти из Google? Записи останутся на этом телефоне, но перестанут сохраняться в общий дневник.')) return;
  REMOTE = null; try { localStorage.removeItem(RKEY); } catch (e) {} gsDropTok(); setSync('off'); closeSheet(); render();
}
function settingsShare(me) {
  const h = `<div class="sec-t">Общий дневник</div>`;
  if (!gOK()) return h + `<p class="hint" style="margin:0">Вход через Google и общий дневник для двух родителей заработают в версии на сайте.</p>`;
  if (!REMOTE) return h + `<p class="hint" style="margin:0 0 10px">Войдите через Google — дневник будет храниться в таблице на вашем Google Диске, появится на всех ваших устройствах, и можно будет пригласить второго родителя.</p>
    <div class="btns"><button class="b" onclick="gsLogin()">${G_ICON} Войти через Google</button></div>
    <p class="hint" style="margin:12px 0 6px">Вас пригласили в общий дневник?</p><div class="btns"><button class="b ghost" onclick="gsJoin('')">Открыть общий дневник</button></div>`;
  const others = Object.entries(S.devs).filter(([k, d]) => k !== DEV && (d.name || d.email));
  return h + `<p class="hint" style="margin:0 0 10px">Вы вошли как <b>${esc(REMOTE.email)}</b>. Дневник хранится в таблице <a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(REMOTE.sheet)}" target="_blank" rel="noopener">«${GS_TITLE}»</a>.</p>
    <label class="f"><span>Как вас подписывать в дневнике</span><input id="s_me" value="${esc(me.name || '')}" placeholder="Мама, Папа, Бабушка…" autocomplete="off">${chipsHtml('me', [['Мама', 'Мама'], ['Папа', 'Папа']], me.name)}</label>
    ${others.length ? `<p class="hint" style="margin:0 0 10px">Ещё ведут дневник: <b>${others.map(([k, d]) => esc(d.name || d.email)).join(', ')}</b></p>` : ''}
    <label class="f"><span>Пригласить второго родителя — его почта Google</span><input id="s_inv" type="email" inputmode="email" placeholder="name@gmail.com" autocomplete="off"></label>
    <div class="err" id="s_ierr"></div>
    <div class="btns"><button class="b" id="s_invb" onclick="invite()">Пригласить</button><button class="b ghost" onclick="shareLink()">Отправить ссылку</button></div>
    <p class="hint" style="margin:8px 0 0">Сначала пригласите по почте — ему придёт письмо со ссылкой. Ссылка открывает дневник только тем, кого пригласили.</p>
    <div class="btns" style="margin-top:12px"><button class="b ghost" onclick="gsLogout()">Выйти из Google</button></div>`;
}

/* ───────── запуск ───────── */
function launch() {
  const q = new URLSearchParams(location.search), a = q.get('action'), j = q.get('join');
  if (!a && !j) return;
  history.replaceState(null, '', location.pathname);
  if (j) { if (REMOTE && REMOTE.sheet === j) toast('Вы уже ведёте этот общий дневник'); else openJoin(j); return; }
  if (a === 'sleep') toggleSleep();
  else if (a === 'feed') { const n = nextSide() || 'L'; if (!activeOf('feed')) breast(n); }
  else if (a === 'day') go('day');
}
function boot() {
  render(); launch();
  if (GAUTH_RET) {
    const g = GAUTH_RET; GAUTH_RET = null;
    if (g.ok && g.join) gsJoin(g.join);
    else if (g.ok && g.first) gsSetup().catch(e => { setSync(REMOTE ? 'err' : 'off'); toast('Не удалось войти: ' + e.message); });
    else if (g.ok) sync();
    else if (g.first || g.join) toast(g.err === 'access_denied' ? 'Вход отменён' : 'Не удалось войти в Google');
    else setSync('need');
  } else if (REMOTE) { gsAutoUntil = Date.now() + 8000; sync(); }
  setInterval(() => { if (!$('#sheetWrap').hidden) { tick(); return; } const n = isNight(); if (n !== document.documentElement.hasAttribute('data-night')) applyNight(); tick(); }, 1000);
  setInterval(() => { if ($('#sheetWrap').hidden) render(); }, 60000);
  // общий дневник: пока приложение открыто — забираем записи второго родителя раз в 30 секунд
  setInterval(() => { if (REMOTE && !document.hidden && $('#sheetWrap').hidden && SYNC.st !== 'need') sync(); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !$('#sheetWrap').hidden) return;
    S = load(); render();
    if (REMOTE) { gsAutoUntil = Date.now() + 8000; sync(); }
  });
  window.addEventListener('storage', e => { if (e.key === KEY && $('#sheetWrap').hidden) { S = load(); render(); } });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
