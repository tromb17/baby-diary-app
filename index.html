<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9f3e3">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Дневник малыша</title>
<style>
/* Днём — светлый мятный градиент и размытые зверята на фоне (.zoo), карточки полупрозрачные.
   Тёмная тема телефона — ночное небо. Ночной режим — почти чёрный, без зверят. */
:root{
  --page:#eaf7ef; --bg:linear-gradient(165deg,#d9f3e3 0%,#eef9ee 30%,#fff5e3 68%,#e3f0fc 100%);
  --surface:rgba(255,255,255,.62); --solid:#ffffff; --surface-2:rgba(255,255,255,.55); --line:rgba(36,94,62,.12);
  --text:#14241b; --text-2:#45584c; --muted:#7c8d82;
  --accent:#2a9d68; --on-accent:#fff; --good:#1a9d5a; --warn:#d98a00; --bad:#d23f3f;
  --c-feed:#e0568f; --c-sleep:#6f5bd9; --c-diaper:#109aa8; --c-pump:#e8743a; --c-food:#4f9a1f;
  --shadow:0 1px 2px rgba(20,60,40,.06),0 6px 20px rgba(20,60,40,.07); --r:20px; --zoo:.9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#10202a; --bg:linear-gradient(165deg,#0e2a25 0%,#132536 55%,#221a38 100%);
    --surface:rgba(24,34,44,.78); --solid:#18222c; --surface-2:rgba(38,52,64,.8); --line:rgba(255,255,255,.09);
    --text:#eef3ef; --text-2:#c2cdc6; --muted:#8a9a91;
    --accent:#4cc28c; --on-accent:#08170f; --good:#44c27f; --warn:#e9a93a; --bad:#ef7070;
    --c-feed:#ef7aa9; --c-sleep:#9d8cf2; --c-diaper:#2dbccb; --c-pump:#f28a58; --c-food:#8fcf5a; --shadow:none; --zoo:.2;
  }
}
:root[data-theme="dark"]{
  --page:#10202a; --bg:linear-gradient(165deg,#0e2a25 0%,#132536 55%,#221a38 100%);
  --surface:rgba(24,34,44,.78); --solid:#18222c; --surface-2:rgba(38,52,64,.8); --line:rgba(255,255,255,.09);
  --text:#eef3ef; --text-2:#c2cdc6; --muted:#8a9a91;
  --accent:#4cc28c; --on-accent:#08170f; --good:#44c27f; --warn:#e9a93a; --bad:#ef7070;
  --c-feed:#ef7aa9; --c-sleep:#9d8cf2; --c-diaper:#2dbccb; --c-pump:#f28a58; --c-food:#8fcf5a; --shadow:none; --zoo:.2;
}
/* ночной режим: почти чёрный экран, тёплый приглушённый текст, крупные кнопки */
:root[data-night]{
  --page:#070605; --bg:#070605; --surface:#110e0c; --solid:#110e0c; --surface-2:#1a1512; --line:#2a211b;
  --text:#d8a888; --text-2:#b48a6f; --muted:#7d6150;
  --accent:#b8805c; --on-accent:#140f0c; --good:#9a8a55; --warn:#c08a4a; --bad:#c06a5a;
  --c-feed:#b86a6a; --c-sleep:#8a74a8; --c-diaper:#6a8f8a; --c-pump:#b07a50; --c-food:#8a9a5a; --shadow:none; --zoo:0;
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"],:root[data-night]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--page)}
body{background:var(--bg);background-attachment:fixed;min-height:100vh;color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.zoo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:var(--zoo);transition:opacity .4s}
.zoo svg{position:absolute;filter:blur(2.5px)}
.card.feed,.card.sleep,.card.diaper{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
:root[data-night] .card.feed,:root[data-night] .card.sleep,:root[data-night] .card.diaper{background:var(--surface)}
.top,main{position:relative;z-index:1}
.ava{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#ffd9a8,#ffb3cf 50%,#b9c8ff);box-shadow:0 2px 8px rgba(0,0,0,.08)}
:root[data-night] .ava{background:#2a211b;box-shadow:none;filter:grayscale(.6) brightness(.7)}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;margin:0 6px}
.syncdot.ok{background:var(--good)} .syncdot.busy{background:var(--warn)} .syncdot.err,.syncdot.need{background:var(--bad)}
.syncbtn{border:0;background:transparent;padding:14px 4px;margin:-10px 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 55%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
:root[data-night] .top{background:var(--page)}
.who{flex:1;min-width:0}
.who h1{font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age{font-size:13px;color:var(--muted)}
.icon-btn{border:0;background:transparent;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--accent);background:var(--surface-2)}

main{max-width:640px;margin:0 auto;padding:0 16px 24px}
.card{background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.st{font-size:14px;color:var(--text-2);margin:4px 0 10px}
.st b{color:var(--text);font-weight:600}
.st .warn{color:var(--warn);font-weight:600}
.feed{--c:var(--c-feed)} .sleep{--c:var(--c-sleep)} .diaper{--c:var(--c-diaper)} .pump{--c:var(--c-pump)} .food{--c:var(--c-food)}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{flex:1 1 0;min-width:0;border:1px solid color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line));background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--surface));color:var(--text);border-radius:13px;padding:12px 8px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.b small{font-weight:500;font-size:11.5px;color:var(--c,var(--accent))}
.b:active{transform:scale(.97)}
.b.main{background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 72%,#ffb36b));border-color:transparent;color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
:root[data-night] .b.main{background:var(--c,var(--accent));box-shadow:none}
.b.main small{color:inherit;opacity:.85}
.b.ghost{background:transparent}
.b.wide{flex-basis:100%}
.b .e{font-size:20px;line-height:1}

.live{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.timer{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sides{display:flex;gap:16px;font-size:14px;color:var(--text-2);margin-bottom:12px}
.sides .cur{color:var(--c);font-weight:700}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum>div{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0;border-top:3px solid var(--c)}
.sum .l{font-size:12px;color:var(--text-2)}
.sum .v{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .s{font-size:12px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--accent);padding:10px 0 0;font-size:14px;font-weight:600}

.daynav{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.daynav h2{flex:1;margin:0;text-align:center;font-size:18px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:40px;font-size:20px;color:var(--text-2)}
.daynav button:disabled{opacity:.35}

.strip{position:relative;height:34px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.strip i{position:absolute;top:0;bottom:0;background:var(--c);opacity:.85}
.strip i.feed{top:55%;opacity:1;min-width:3px}
.strip i.diaper{top:auto;bottom:0;height:5px;width:5px;border-radius:50%;opacity:1;transform:translateX(-50%)}
.strip i.nowl{background:var(--text);width:1.5px;opacity:.6}
.strip-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.list li:first-child{border-top:0}
.list .tm{width:92px;flex:none;font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.list .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);font-size:17px}
.list .tx{flex:1;min-width:0}
.list .tx div{font-weight:600}
.list .tx small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:18px 0 8px;font-size:14px}

.adv h3{margin-bottom:6px}
.adv ul{margin:6px 0 0;padding-left:20px}
.adv li{margin:3px 0}
.adv .src{font-size:12px;color:var(--muted);margin-top:8px}
.adv.alarm{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.adv.alarm h3{color:var(--bad)}
table.norm{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.norm td,.norm th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.norm th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500}
.norm tr.me td{font-weight:700;color:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:600}

.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:relative;background:var(--solid);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:19px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;min-height:44px}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px}
.chk input{width:22px;height:22px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .b{flex:1}
.b.del{--c:var(--bad);background:transparent}
.err{color:var(--bad);font-size:13.5px;min-height:1px;margin:0 0 8px}
.sec-t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--page);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px}


/* переключатель */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--solid);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* рост и вес */
.gnow .v{font-size:30px;font-weight:700}
.gnow .v small{font-size:15px;color:var(--muted);font-weight:500}
.gnow .s{font-size:13px;color:var(--muted)}
.pct{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:10px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pct.low,.pct.high{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.gchart{margin-top:10px}
.gchart svg{display:block;width:100%;height:auto}
.gchart .grid{stroke:var(--line)} .gchart .ax{fill:var(--muted);font-size:11px}
.gchart .b97{fill:color-mix(in srgb,var(--accent) 13%,transparent)} .gchart .b85{fill:color-mix(in srgb,var(--accent) 22%,transparent)}
.gchart .p50{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.gchart .today{stroke:var(--muted);stroke-dasharray:2 3}
.gchart .me{fill:none;stroke:var(--c-feed);stroke-width:2.5;stroke-linejoin:round}
.gchart .dot{fill:var(--c-feed);stroke:var(--solid);stroke-width:2}
/* прививки: обязательные — сплошные, группы риска — серые, по желанию — пунктир и свой цвет */
.vleg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.vtag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.vtag.all{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.vtag.risk{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.vtag.opt{color:var(--c-sleep);border:1.5px dashed color-mix(in srgb,var(--c-sleep) 60%,transparent);background:transparent}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.vdate{font-size:13px;color:var(--muted);white-space:nowrap}
.vgrp.now{border-color:color-mix(in srgb,var(--warn) 55%,transparent)} .vgrp.now .vdate{color:var(--warn);font-weight:600}
.vgrp.soon .vdate{color:var(--accent);font-weight:600}
.vgrp.done{opacity:.75} .vgrp.done .vdate{color:var(--good);font-weight:600}
.vlist{list-style:none;margin:8px 0 0;padding:0}
.vlist li{display:flex;align-items:center;gap:12px;padding:10px;margin-top:6px;border-radius:13px;cursor:pointer;background:var(--surface-2);border:1px solid transparent}
.vlist li.all{border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.vlist li.opt{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c-sleep) 45%,transparent)}
.vlist li.risk{background:transparent;border:1px solid var(--line)} .vlist li.risk .tx div{color:var(--text-2);font-weight:500}
.vlist .tx{flex:1;min-width:0} .vlist .tx div{font-weight:600} .vlist .tx small{color:var(--muted);font-size:12.5px;display:block}
.vchk{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.vlist li.ok .vchk,.vchk.on{background:var(--good);border-color:var(--good)}
.vlist li.ok .tx div{text-decoration:none;color:var(--text-2)}
/* вехи */
.mbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:12px 0 4px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc36b,var(--c-feed),var(--c-sleep));border-radius:99px}
.mlist li.late .tx small{color:var(--warn)}
.mlist li.next{opacity:.7}
.mlist .ic{--c:var(--accent)}
/* врачи */
.vbig{font-size:22px;font-weight:700;margin-top:6px}
.nextv{cursor:pointer;border-color:color-mix(in srgb,var(--c-diaper) 45%,transparent);background:color-mix(in srgb,var(--c-diaper) 9%,var(--surface))}
.qadd{display:flex;gap:8px;margin-top:10px}
.qadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:46px}
.qadd .b{flex:none;width:50px;font-size:22px;padding:0}
.qlist{list-style:none;margin:8px 0 0;padding:0}
.qlist li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist .tx{flex:1;min-width:0;cursor:pointer}
.qlist .tx small{display:block;color:var(--muted);font-size:12.5px}
.qlist li.ok .tx{color:var(--text-2)}
.qlist button.vchk{background:transparent;padding:0;cursor:pointer}
.qdone summary,.ckp summary{cursor:pointer;color:var(--text-2);font-size:14px;padding:8px 0 2px}
details.ckp{border-top:1px solid var(--line);padding:4px 0 8px}
details.ckp summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;list-style:none;color:var(--text);font-size:15px}
details.ckp summary::-webkit-details-marker{display:none}
details.ckp summary::before{content:'›';display:inline-block;width:12px;color:var(--muted);transition:transform .15s}
details.ckp[open] summary::before{transform:rotate(90deg)}
details.ckp summary b{flex:1}
details.ckp.now .vdate{color:var(--warn);font-weight:600} details.ckp.soon .vdate{color:var(--accent);font-weight:600} details.ckp.done .vdate{color:var(--good);font-weight:600}
.list small.rx{color:var(--c-diaper)}
.list small.soon{color:var(--accent);font-weight:600}
/* прикорм */
.fgrp{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}
.fgrp.early{opacity:.6}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px}
.fchips button.ok{background:color-mix(in srgb,var(--good) 15%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good);font-weight:600}
.fchips button.intro{border:1.5px dashed var(--c-food);color:var(--c-food);font-weight:600;background:transparent}
.fchips button.react{background:color-mix(in srgb,var(--warn) 15%,transparent);border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn);font-weight:600}
details.ckp.early summary b{color:var(--text-2);font-weight:500}
ol.rcp{margin:6px 0 4px;padding-left:20px;font-size:14px;color:var(--text-2)} ol.rcp li{margin:3px 0}
/* сводка */
.rep .rsec ul{margin:0;padding-left:18px} .rep .rsec li{margin:3px 0} .rep .sec-t{margin:14px 0 4px}
/* звуки */
.snds li .play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--c-sleep);font-size:14px;flex:none}

/* альбом */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.atile{border:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph{display:block;aspect-ratio:4/5;background:linear-gradient(135deg,#ffe3ec,#e3f1ff);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.none{display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,color-mix(in srgb,var(--c-feed) 14%,var(--surface)),color-mix(in srgb,var(--c-sleep) 14%,var(--surface)))}
.ph.miss::after{content:'фото на другом телефоне';position:absolute;inset:auto 0 0;padding:6px;font-size:11.5px;color:var(--muted);text-align:center}
.ph.big{aspect-ratio:auto;max-height:62vh;border-radius:16px;background:var(--surface-2)} .ph.big img{max-height:62vh;object-fit:contain}
.ph.pick{aspect-ratio:auto;height:180px;border-radius:14px} .phx{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
.atile .cap{padding:9px 11px 11px;display:block}
.atile .cap b{display:block;font-size:14.5px;line-height:1.25}
.atile .cap small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.card.demo{border:1.5px dashed color-mix(in srgb,var(--c-sleep) 50%,transparent)}

/* чат */
.chatb{position:relative}
.badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--c-feed);color:#fff;font:700 11px/17px system-ui;font-style:normal;text-align:center;padding:0 4px}
body.inchat{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.chatbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.chatbar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--solid);border-radius:20px;padding:10px 14px;min-height:42px;max-height:120px;line-height:1.35}
.chatbar .csend{flex:none;width:44px;height:44px;border-radius:50%;padding:0;font-size:18px}
.chatbar .icon-btn{font-size:20px}
.cday{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 6px}
.msg{display:flex;flex-direction:column;margin:4px 0;max-width:82%}
.msg.me{margin-left:auto;align-items:flex-end} .msg.them{align-items:flex-start}
.bub{border-radius:18px;padding:9px 13px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;overflow:hidden;cursor:pointer}
.msg.me .bub{background:color-mix(in srgb,var(--accent) 18%,var(--solid));border-color:color-mix(in srgb,var(--accent) 30%,transparent);border-bottom-right-radius:6px}
.msg.them .bub{border-bottom-left-radius:6px}
.bub .cph{display:block;aspect-ratio:auto;height:220px;margin:-9px -13px 6px;width:calc(100% + 26px);min-width:220px;border-radius:0}
.bub .cph:last-child{margin-bottom:-9px}
.mt{font-size:11.5px;color:var(--muted);margin:2px 6px 0}
/* книжка */
.bookbar{display:flex;gap:8px;margin-bottom:10px} .bookbar .b{flex:1}
.book{margin:0 auto;width:148mm}
.bpage{width:148mm;height:210mm;padding:12mm 12mm 14mm;margin:0 0 6mm;background:#fffaf3;color:#3a2e26;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;box-shadow:0 2px 12px rgba(60,40,20,.18);font-family:Georgia,"Times New Roman",serif;page-break-after:always;break-after:page}
.bph{width:100%;flex:0 1 auto;height:128mm;border-radius:4mm;overflow:hidden;background:#f1e7da;position:relative}
.bph img{width:100%;height:100%;object-fit:cover;display:block}
.bph.miss::after{content:'фото не найдено';position:absolute;inset:0;display:grid;place-items:center;color:#a08c7a;font-size:11pt}
.bemo{font-size:60mm;line-height:1;margin:20mm 0 8mm}
.bgrp{align-self:flex-start;font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:#b0835a;margin:0 0 4mm} .bgrp.dim{opacity:.55}
.bt{font-size:20pt;margin:7mm 0 1.5mm;text-align:center;line-height:1.15}
.bd{font-size:10pt;color:#9a8574}
.bn{font-size:11.5pt;font-style:italic;text-align:center;margin-top:5mm;line-height:1.45;color:#5a4a3e;max-width:115mm}
.bno{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font-size:8.5pt;color:#c0a993}
.bcover{justify-content:center;background:linear-gradient(170deg,#fff4e6,#ffe7ef 55%,#e8f3ff)}
.bcover .bph{height:110mm;border-radius:50% / 40%;width:100mm;border:3mm solid #fff;box-shadow:0 3mm 8mm rgba(80,50,30,.15)}
.btitle{font-size:13pt;letter-spacing:.2em;text-transform:uppercase;color:#b0835a;margin-top:9mm}
.bname{font-size:32pt;margin-top:3mm}
.bsub{font-size:11pt;color:#9a8574;margin-top:2mm}
ul.bms{list-style:none;padding:0;margin:0;width:100%;font-size:11pt}
ul.bms li{display:flex;justify-content:space-between;gap:4mm;padding:2mm 0;border-bottom:.3mm dotted #d8c6b4}
ul.bms b{font-weight:normal;color:#9a8574;white-space:nowrap}
@page{size:A5;margin:0}

}

.leaps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}

.leaps small{font-size:9.5px;font-weight:500;color:var(--muted)} .leaps .past{opacity:.45} .leaps .now{background:var(--c-sleep);color:#fff} .leaps .now small{color:#fff}
.card.game h3{font-size:15.5px}
.card.spurt{border-color:color-mix(in srgb,var(--c-feed) 40%,transparent);background:color-mix(in srgb,var(--c-feed) 7%,var(--surface))}

.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.sndbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:31;display:flex;align-items:center;gap:2px;max-width:calc(100vw - 32px);background:var(--c-sleep);color:#fff;border-radius:999px;box-shadow:0 3px 12px rgba(60,40,140,.3);padding:2px 2px 2px 4px}

body.withsnd{padding-bottom:calc(116px + env(safe-area-inset-bottom))}
body.inchat.withsnd{padding-bottom:calc(180px + env(safe-area-inset-bottom))}

@media print{.sndbar{display:none!important}}
/* звук: пауза */

<script>
'use strict';
/* ───────── хранение ─────────
   Всё лежит в localStorage. Каждая запись — событие {id, t, s, e, …, by, u, del}:
   id — уникальный, u — время последней правки, del — удалено (не стираем сразу, чтобы потом
   правильно объединять дневники двух родителей: по id побеждает более свежая правка, mergeEvents). */
const KEY = 'babydiary.v1', DEVKEY = 'babydiary.dev', NIGHTKEY = 'babydiary.night.v1', LASTKEY = 'babydiary.last.v1';
const DEL_DAYS = 30;
const $ = s => document.querySelector(s);
const now = () => Date.now() + (window.__shift || 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsJson(k, d) { try { return JSON.parse(lsGet(k)) || d; } catch (e) { return d; } }
// Android-приложение: window.BabyNative (BabyPlugin.java) — вход через Google, ярлыки, отклик, номер сборки. В браузере его нет.
const NATIVE = window.BabyNative || null;
const DEV = lsGet(DEVKEY) || (() => { const d = uid(); lsSet(DEVKEY, d); return d; })();

/* Кроме событий в общий дневник уходят ещё две записи того же вида: 'baby' (имя, дата рождения)
   и 'dev:<устройство>' (как зовут родителя — «Мама», «Папа»). Всё объединяется одинаково: по id, свежее u. */
function normalize(s) {
  if (!s || typeof s !== 'object') s = {};
  s.v = 1;
  s.baby = Object.assign({ name: '', birth: '', sex: '', u: 0 }, s.baby || {});
  s.devs = s.devs && typeof s.devs === 'object' ? s.devs : {};
  const old = now() - DEL_DAYS * 864e5;
  s.events = (Array.isArray(s.events) ? s.events : []).filter(e => e && e.id && e.t && isFinite(e.s) && !(e.del && e.u < old));
  return s;
}
function load() { return normalize(lsJson(KEY, null)); }
function save() { lsSet(KEY, JSON.stringify(S)); }
let S = load();

// очередь на отправку в таблицу: {id: u}. Пишем всегда — при входе в Google уйдёт всё, что накопилось.
const OUTKEY = 'babydiary.out.v1';
function mark(id, u) { const o = lsJson(OUTKEY, {}); o[id] = u; lsSet(OUTKEY, JSON.stringify(o)); if (typeof schedulePush === 'function') schedulePush(); }

const evs = () => S.events.filter(e => !e.del);
const byStart = (a, b) => b.s - a.s;
const activeOf = t => evs().find(e => e.t === t && e.e == null);
const lastOf = (t, f) => evs().filter(e => e.t === t && (!f || f(e))).sort(byStart)[0];
const evById = id => S.events.find(e => e.id === id);
function add(o) { const e = Object.assign({ id: uid(), by: DEV, u: now() }, o); S.events.push(e); save(); mark(e.id, e.u); return e; }
function upd(e, p) { e = evById(e.id) || e; Object.assign(e, p, { u: now() }); save(); mark(e.id, e.u); return e; }
function setBaby(p) { Object.assign(S.baby, p, { u: now() }); save(); mark('baby', S.baby.u); }
function setMe(p) { S.devs[DEV] = Object.assign({ name: '', email: '' }, S.devs[DEV], p, { u: now() }); save(); mark('dev:' + DEV, S.devs[DEV].u); }
const devName = id => (S.devs[id] || {}).name || '';
function mergeEvents(a, b) {
  const m = new Map();
  for (const e of [...a, ...b]) { const o = m.get(e.id); if (!o || (e.u || 0) > (o.u || 0)) m.set(e.id, e); }
  return [...m.values()];
}

/* ───────── время и слова ───────── */
const pad = n => String(n).padStart(2, '0');
function pl(n, a, b, c) { n = Math.abs(n) % 100; const d = n % 10; return n > 10 && n < 20 ? c : d === 1 ? a : d > 1 && d < 5 ? b : c; }
function hm(ts) { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMin(ms) { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + ' мин'; const h = Math.floor(m / 60), r = m % 60; return h + ' ч' + (r ? ' ' + r + ' мин' : ''); }
function fmtTimer(ms) { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); }
function fmtAgo(ts) { const ms = now() - ts; return ms < 60000 ? 'только что' : fmtMin(ms) + ' назад'; }
function sod(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return +d; }
function addDays(ts, n) { const d = new Date(ts); d.setDate(d.getDate() + n); return +d; }
function toInput(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fromInput(v) { if (!v) return null; const t = +new Date(v); return isFinite(t) ? t : null; }
function parseDay(v) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(v || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
function dayTitle(ts) {
  const t = sod(now()), d = new Date(ts);
  const base = d.getDate() + ' ' + MONTHS[d.getMonth()];
  return ts === t ? 'Сегодня, ' + base : ts === addDays(t, -1) ? 'Вчера, ' + base : base + ', ' + WD[d.getDay()];
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────── возраст и ориентиры ───────── */
function age() {
  const b = parseDay(S.baby.birth); if (!b) return null;
  const d = new Date(now()), total = Math.round((sod(+d) - +b) / 864e5);
  if (total < 0) return { total, m: 0, days: 0 };
  let m = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth();
  const mAt = k => { const y = b.getFullYear(), mo = b.getMonth() + k, dim = new Date(y, mo + 1, 0).getDate(); return new Date(y, mo, Math.min(b.getDate(), dim)); };
  if (mAt(m) > d) m--;
  return { total, m, days: Math.round((sod(+d) - +mAt(m)) / 864e5) };
}
function ageText() {
  const a = age(); if (!a) return '';
  if (a.total < 0) return 'ещё не родился';
  if (a.m < 1) return a.total + ' ' + pl(a.total, 'день', 'дня', 'дней');
  if (a.m >= 12) { const y = Math.floor(a.m / 12), r = a.m % 12; return y + ' ' + pl(y, 'год', 'года', 'лет') + (r ? ' ' + r + ' мес.' : ''); }
  return a.m + ' мес.' + (a.days ? ' ' + a.days + ' дн.' : '');
}
// Время бодрствования: ориентир по возрасту (до N месяцев). Единых норм в исследованиях нет — это распространённые рекомендации.
const WAKE = [[1, '40–60 мин', 40, 60], [2, '1–1,5 ч', 60, 90], [4, '1¼–2 ч', 75, 120], [6, '2–2,5 ч', 120, 150], [9, '2,5–3 ч', 150, 180], [12, '3–4 ч', 180, 240]];
// Сон за сутки: до 4 мес. — 14–17 ч (National Sleep Foundation), 4–12 мес. — 12–16 ч (AASM, одобрено AAP).
const SLEEP = [[4, '14–17 ч', 14, 17], [12, '12–16 ч', 12, 16]];
const pick = (tab, m) => tab.find(r => m < r[0]) || tab[tab.length - 1];
const ageM = () => { const a = age(); return a && a.total >= 0 ? a.m : null; };

/* ───────── кормление ───────── */
const SIDE = { L: 'Левая', R: 'Правая' }, SIDE1 = { L: 'Л', R: 'П' };
const other = s => s === 'L' ? 'R' : 'L';
function segsDur(e, side) { let t = 0; for (const g of e.segs || []) if (!side || g.side === side) t += (g.e ?? now()) - g.s; return t; }
const openSeg = e => { const g = (e.segs || [])[(e.segs || []).length - 1]; return g && g.e == null ? g : null; };
function lastSide() { const f = lastOf('feed', e => e.kind === 'breast' && (e.segs || []).length); return f ? f.segs[f.segs.length - 1].side : null; }
function nextSide() { const s = lastSide(); return s ? other(s) : null; }

function breast(side) {
  const t = now(); const f = activeOf('feed');
  if (f && f.kind === 'breast') {
    const g = openSeg(f); if (g && g.side === side) return;
    if (g) g.e = t;
    f.segs.push({ side, s: t, e: null }); upd(f, {});
  } else {
    if (f) upd(f, { e: t });
    add({ t: 'feed', kind: 'breast', s: t, e: null, segs: [{ side, s: t, e: null }] });
  }
  buzz(); render();
}
function pauseFeed() { const f = activeOf('feed'), g = f && openSeg(f); if (g) { g.e = now(); upd(f, {}); render(); } }
function stopFeed() {
  const f = activeOf('feed'); if (!f) return;
  const t = now(), g = openSeg(f); if (g) g.e = t;
  upd(f, { e: t }); buzz();
  toast('Кормление записано: ' + fmtMin(segsDur(f)), { label: 'Изменить', fn: () => editEvent(f.id) });
  render();
}

/* ───────── сон и подгузник ───────── */
function toggleSleep() {
  const a = activeOf('sleep'), t = now();
  if (a) { upd(a, { e: t }); toast('Сон записан: ' + fmtMin(t - a.s), { label: 'Изменить', fn: () => editEvent(a.id) }); }
  else add({ t: 'sleep', s: t, e: null });
  buzz(); render();
}
function diaper(k) {
  const t = now(), e = add({ t: 'diaper', s: t, e: t, wet: k !== 'dirty', dirty: k !== 'wet' });
  buzz(); toast(diaperTxt(e) + ' — записано', { label: 'Отменить', fn: () => { upd(e, { del: true }); render(); } });
  render();
}
const diaperTxt = e => 'Подгузник: ' + (e.wet && e.dirty ? 'мокрый и грязный' : e.dirty ? 'грязный' : 'мокрый');
function lastAwake() { if (activeOf('sleep')) return null; const s = lastOf('sleep', e => e.e != null); return s ? s.e : null; }

/* ───────── отклик ───────── */
function buzz() { try { if (NATIVE) { NATIVE.haptic(); return; } } catch (e) {} try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} }
let toastT;
function toast(text, act) {
  const el = $('#toast'); clearTimeout(toastT);
  el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button>' + esc(act.label) + '</button>' : '');
  if (act) el.querySelector('button').onclick = () => { el.hidden = true; act.fn(); };
  el.hidden = false; toastT = setTimeout(() => el.hidden = true, 4500);
}

/* ───────── ночной режим ─────────
   По расписанию (auto, from–to, можно через полночь) и кнопкой-луной в шапке. Кнопка действует до ближайшей
   смены по расписанию (без расписания — 12 часов). Настройка на устройстве, не в дневнике. */

/* ───────── день ───────── */
const DIARY = new Set(['feed', 'sleep', 'diaper', 'pump', 'food']); // остальное (замеры, прививки, вехи) — в своих разделах
function dayEvents(day) {
  const a = day, b = addDays(day, 1), t = now();
  return evs().filter(e => DIARY.has(e.t) && e.s < b && (e.e ?? t) >= a && (e.t === 'sleep' || e.s >= a)).sort(byStart);
}
function daySum(day) {
  const a = day, b = addDays(day, 1), t = now(), list = dayEvents(day);

  for (const e of list) {
    if (e.t === 'feed') { r.feeds++; if (e.kind === 'breast') { r.L += segsDur(e, 'L'); r.R += segsDur(e, 'R'); } else { r.bottles++; r.ml += +e.ml || 0; } }
    else if (e.t === 'sleep') { r.sleep += Math.max(0, Math.min(b, e.e ?? t) - Math.max(a, e.s)); if (e.s >= a) r.naps++; }
    else if (e.t === 'diaper') { r.diapers++; if (e.wet) r.wet++; if (e.dirty) r.dirty++; }
    else if (e.t === 'pump') r.pump += +e.ml || 0;
  }
  return r;
}
function sumGrid(d) {
  const fs = [d.L >= 30000 ? 'Л ' + fmtMin(d.L) : '', d.R >= 30000 ? 'П ' + fmtMin(d.R) : '', d.ml ? d.ml + ' мл' : ''].filter(Boolean).join(' · ') || '—';
  return `<div class="sum">
    <div class="feed"><div class="l">Кормления</div><div class="v num">${d.feeds}</div><div class="s">${fs}</div></div>
    <div class="sleep"><div class="l">Сон</div><div class="v num">${d.sleep ? fmtMin(d.sleep).replace(' мин', ' м') : '—'}</div><div class="s">${d.naps ? d.naps + ' ' + pl(d.naps, 'раз', 'раза', 'раз') : '—'}</div></div>
    <div class="diaper"><div class="l">Подгузники</div><div class="v num">${d.diapers}</div><div class="s">💧 ${d.wet} · 💩 ${d.dirty}</div></div>
  </div>`;
}
function viewDay() {
  const day = UI.day ?? sod(now()), today = sod(now()), list = dayEvents(day), d = daySum(day), m = ageM();
  let h = `<div class="daynav"><button onclick="shiftDay(-1)" aria-label="Предыдущий день">‹</button><h2>${dayTitle(day)}</h2><button onclick="shiftDay(1)" aria-label="Следующий день" ${day >= today ? 'disabled' : ''}>›</button></div>`;
  h += `<div class="card">${sumGrid(d)}${strip(day, list)}`;
  if (m != null) {
    const sn = pick(SLEEP, m);
    h += `<p class="hint">Ориентиры для возраста: сон ${sn[1]} в сутки${m < 2 ? ', кормлений 8–12' : ''}${age().total >= 5 ? ', мокрых подгузников — от 6' : ''}.</p>`;
  }
  h += `</div>`;
  h += `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><h3>Записи</h3><button class="link" style="padding:0" onclick="openAdd(${day})">+ Добавить</button></div>`;

function shiftDay(n) { UI.day = Math.min(sod(now()), addDays(UI.day ?? sod(now()), n)); render(); }
function strip(day, list) {
  const a = day, b = addDays(day, 1), t = now(), L = 864e5, p = x => ((Math.max(a, Math.min(b, x)) - a) / L * 100).toFixed(2) + '%';
  let h = '';

  return `<div class="strip">${h}</div><div class="strip-ax"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>

function evInfo(e) {

const last = () => lsJson(LASTKEY, {});
function chipsHtml(name, opts, val) { return `<div class="chips" data-name="${name}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(v) === String(val) ? 'on' : ''}" onclick="chip(this)">${t}</button>`).join('')}</div>`; }
function chip(btn) {

   Фото (альбом, чат) кладём в ту же таблицу, лист «Фото»: строка = id | частей | части base64 (по 45 000 знаков —
   в ячейке до 50 000). Копия — 1024 px, JPEG ≈ 0,1–0,2 МБ. Так второй родитель видит фото без отдельного доступа к Диску
   (права drive.file дают ему только выбранную таблицу). Очередь отправки — babydiary.phout.v1 [{id, at}];
   отправляем, только если фото есть в записях (пока окно правки открыто — ждём, до часа). Нет фото на устройстве —
   скачиваем по id (phFetch) и сохраняем у себя. */
const PHOUT = 'babydiary.phout.v1', GS_PH = 'Фото', PH_CHUNK = 45000;
const PHX = { idx: null, idxAt: 0, wait: new Map(), tab: false };
function phQueue(id) { const q = lsJson(PHOUT, []); if (!q.some(x => x.id === id)) { q.push({ id, at: Date.now() }); lsSet(PHOUT, JSON.stringify(q)); } }
const phUsed = id => S.events.some(e => !e.del && (e.ph || []).includes(id));
function blobB64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
function b64Blob(s, type) { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: type || 'image/jpeg' }); }
async function photoRow(id, blob) { const s = await blobB64(blob), parts = []; for (let i = 0; i < s.length; i += PH_CHUNK) parts.push(s.slice(i, i + PH_CHUNK)); return [id, parts.length, ...parts]; }
const rowBlob = row => b64Blob(row.slice(2, 2 + (+row[1] || 0)).join(''));
async function gsPhotoTab() {
  if (PHX.tab) return;
  const meta = await gsApi('?fields=sheets.properties(title)');
  if (!(meta.sheets || []).some(s => s.properties.title === GS_PH)) await gsApi(':batchUpdate', { method: 'POST', body: { requests: [{ addSheet: { properties: { title: GS_PH } } }] } });
  PHX.tab = true;
}
async function pushPhotos() {
  let q = lsJson(PHOUT, []); if (!q.length) return;
  for (const it of q.slice(0, 3)) {
    let drop = false;
    if (phUsed(it.id)) {
      const rec = await phGet(it.id).catch(() => null);
      if (rec) {
        await gsPhotoTab();
        const src = rec.full, img = await loadImage(src), mid = (img.naturalWidth > 1024 || img.naturalHeight > 1024) ? await shrink(img, 1024, 0.74) : src;
        await gsApi('/values/' + encodeURIComponent(GS_PH + '!A1') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: { values: [await photoRow(it.id, mid)] } });
        if (PHX.idx) PHX.idx = null;
      }
      drop = true;
    } else if (Date.now() - it.at > 3600e3) drop = true;
    if (drop) { q = lsJson(PHOUT, []).filter(x => x.id !== it.id); lsSet(PHOUT, JSON.stringify(q)); }
  }
}
// фото, которого нет на устройстве: найти строку на листе «Фото», собрать, сохранить у себя
function phFetch(id) {
  if (!REMOTE) return Promise.resolve(null);
  if (PHX.wait.has(id)) return PHX.wait.get(id);
  const p = (async () => {
    if (isY()) { const full = await yPhoto(id); if (!full) return null;
      (async () => { try { const thumb = await shrink(await loadImage(full), 480, 0.78); await phPut(id, { full, thumb, at: Date.now(), remote: 1 }); } catch (e) {} })();
      const u = URL.createObjectURL(full); PH.url.set(id + ':full', u); PH.url.set(id + ':thumb', u); return u; }
    if (!PHX.idx || (!PHX.idx.has(id) && Date.now() - PHX.idxAt > 60000)) {
      const r = await gsApi('/values/' + encodeURIComponent(GS_PH + '!A:A')).catch(() => ({}));
      PHX.idx = new Map((r.values || []).map((v, i) => [v[0], i + 1])); PHX.idxAt = Date.now();
    }
    const n = PHX.idx.get(id); if (!n) return null;
    const r = await gsApi('/values/' + encodeURIComponent(GS_PH + '!A' + n + ':AZ' + n));
    const row = (r.values || [])[0]; if (!row || row[0] !== id) { PHX.idx = null; return null; }
    const full = rowBlob(row);
    (async () => { try { const thumb = await shrink(await loadImage(full), 480, 0.78); await phPut(id, { full, thumb, at: Date.now(), remote: 1 }); } catch (e) {} })();
    const u = URL.createObjectURL(full); PH.url.set(id + ':full', u); PH.url.set(id + ':thumb', u); return u;
  })().catch(() => null).finally(() => setTimeout(() => PHX.wait.delete(id), 30000));
  PHX.wait.set(id, p); return p;
}

/* ───────── напоминания о приёме врача (Android) ─────────
   План на 45 дней: накануне в 20:00 и за 2 часа (настройка — babydiary.notif.v1, на устройстве).
   Телефон ставит будильник на ближайшее (Notifier.java), после перезагрузки — заново. В браузере уведомлений нет. */
const NOTIFKEY = 'babydiary.notif.v1';
const notifPref = () => Object.assign({ eve: true, before: true }, lsJson(NOTIFKEY, {}));
function notifPlan() {
  const p = notifPref(), t = now(), out = [], nq = qs().filter(q => !q.done).length;
  for (const v of visits()) {
    if (v.concl || v.s <= t || v.s > t + 45 * 864e5) continue;
    const where = [hm(v.s), v.place].filter(Boolean).join(', '), qtxt = nq ? ' Вопросов к врачу: ' + nq + '.' : '';
    const eve = addDays(sod(v.s), -1) + 20 * 3600e3;
    if (p.eve && eve > t) out.push({ id: 've:' + v.id, at: eve, title: 'Завтра — ' + (v.doc || 'врач'), text: where + '.' + qtxt, action: 'docs' });
    const bf = v.s - 2 * 3600e3;
    if (p.before && bf > t) out.push({ id: 'vb:' + v.id, at: bf, title: 'Через 2 часа — ' + (v.doc || 'врач'), text: where + '.' + qtxt + ' Не забудьте полис и прививочный сертификат.', action: 'docs' });
  }
  return out.sort((a, b) => a.at - b.at);
}
function pushNotif() {
  if (!NATIVE || typeof NATIVE.schedule !== 'function') return;
  const plan = notifPlan(), j = JSON.stringify(plan); if (j === pushNotif.last) return;
  pushNotif.last = j;
  try { NATIVE.schedule(j); if (plan.length && typeof NATIVE.askNotify === 'function') NATIVE.askNotify(); } catch (e) {}
}

/* ───────── сон: страница с графиком, средние и нормы ─────────
   Открывается с карточки «Сон» на главной (UI.tab='sleep'). Полные дни до сегодня (UI.sdays 7|14), ночь — 21:00–07:00.
   Ориентир «следующий сон» — середина окна бодрствования для возраста (простая подсказка, не прогноз). */
const NIGHT_FROM = 21, NIGHT_TO = 7;
function sleepStats(n) {
  const today = sod(now()), b = birthTs(); let from = addDays(today, -n); if (b != null && from < sod(b)) from = sod(b);
  const days = []; for (let d = from; d < today; d = addDays(d, 1)) days.push(d);
  const all = evs().filter(e => e.t === 'sleep' && e.e != null), rows = [];
  for (const d of days) {
    const a = d, z = addDays(d, 1), list = all.filter(e => e.s < z && e.e > a);
    let tot = 0, night = 0;
    for (const e of list) {
      const s = Math.max(a, e.s), en = Math.min(z, e.e); tot += en - s;
      // ночная часть: 00:00–07:00 и 21:00–24:00 этих суток
      const n1 = Math.max(0, Math.min(en, a + NIGHT_TO * 3600e3) - s), n2 = Math.max(0, en - Math.max(s, a + NIGHT_FROM * 3600e3));
      night += Math.max(0, n1) + Math.max(0, n2);
    }
    const naps = list.filter(e => e.s >= a && e.s < z && new Date(e.s).getHours() >= NIGHT_TO && new Date(e.s).getHours() < NIGHT_FROM).length;
    rows.push({ d, list, tot, night, day: tot - night, naps, has: list.length > 0 });
  }
  const with_ = rows.filter(r => r.has), k = with_.length, avg = f => k ? with_.reduce((x, r) => x + f(r), 0) / k : 0;
  // бодрствование между снами днём
  const gaps = []; const ss = all.filter(e => e.s >= from && e.s < today).sort((x, y) => x.s - y.s);
  for (let i = 1; i < ss.length; i++) { const g = ss[i].s - ss[i - 1].e, h = new Date(ss[i].s).getHours(); if (g > 10 * 60000 && g < 8 * 3600e3 && h >= NIGHT_TO && h < 23) gaps.push(g); /* и вечернее — до ночного сна */ }
  return { rows, k, tot: avg(r => r.tot), night: avg(r => r.night), day: avg(r => r.day), naps: avg(r => r.naps), longest: ss.reduce((m, e) => Math.max(m, e.e - e.s), 0), wake: gaps.length ? gaps.reduce((x, y) => x + y, 0) / gaps.length : 0 };
}
function nextSleepHint() {
  const aw = lastAwake(), m = ageM(); if (!aw || m == null || activeOf('sleep')) return '';
  const w = pick(WAKE, m), at = aw + (w[2] + w[3]) / 2 * 60000;
  return at > now() ? `Следующий сон — ориентир <b>около ${hm(at)}</b> (бодрствование для возраста ${w[1]}). Смотрите на признаки усталости.` : `Уже пора укладывать: малыш не спит дольше ориентира (${w[1]}).`;
}

  h += `<div class="card sleep ${sl ? 'live' : ''}"><h3><span class="dot"></span>${sl ? 'Спит' : 'Сейчас не спит'}</h3>${sl ? `<div class="timer" data-from="${sl.s}"></div><div class="st">уснул в ${hm(sl.s)}</div>` : `<p class="st">${forecastLine() || nextSleepHint() || 'Записей сна пока нет.'}</p>`}
    <div class="btns"><button class="b main" onclick="toggleSleep()">${sl ? '☀️ Проснулся' : '🌙 Уснул'}</button><button class="b" onclick="addKind('sleep',now())">+ Сон задним числом</button></div></div>`;

  if (!st.k) return h + `<div class="card"><div class="empty">За эти дни сна не записано</div></div>`;
  const inNorm = norm ? (st.tot / H < norm[2] ? 'low' : st.tot / H > norm[3] ? 'high' : 'ok') : '';

    <div class="snorm"><div class="v num">${fmtMin(st.tot)}</div>${norm ? `<div class="pct ${inNorm}">${inNorm === 'ok' ? 'в пределах ориентира' : inNorm === 'low' ? 'меньше ориентира' : 'больше ориентира'} ${norm[1]}</div>` : ''}</div>
    ${norm ? `<div class="nbar"><i class="rng" style="left:${norm[2] / 20 * 100}%;width:${(norm[3] - norm[2]) / 20 * 100}%"></i><i class="me" style="left:${Math.min(100, st.tot / H / 20 * 100)}%"></i></div><div class="strip-ax"><span>0</span><span>5</span><span>10</span><span>15</span><span>20 ч</span></div>` : ''}
    <table class="norm" style="margin-top:10px"><tr><td>Ночью (21–7)</td><td><b>${fmtMin(st.night)}</b></td></tr><tr><td>Днём</td><td><b>${fmtMin(st.day)}</b>, ${r1(st.naps)} ${pl(Math.round(st.naps), 'раз', 'раза', 'раз')}</td></tr>
    ${st.wake ? `<tr><td>Бодрствование днём</td><td><b>${fmtMin(st.wake)}</b>${wk ? ` <span class="hint">(ориентир ${wk[1]})</span>` : ''}</td></tr>` : ''}<tr><td>Самый долгий сон</td><td><b>${fmtMin(st.longest)}</b></td></tr></table>
    <p class="hint">Считаются дни с записями (${st.k} из ${st.rows.length}). Ориентиры — National Sleep Foundation, AASM/AAP; у каждого малыша свой ритм.</p></div>`;

  const rowsV = [{ d: T0, list: tl, tot: tl.reduce((x, e) => x + Math.min(now(), e.e ?? now()) - Math.max(T0, e.s), 0), has: tl.length > 0, today: true }, ...st.rows.slice().reverse()];
  h += `<div class="card"><h3>График</h3><div class="sgrid">${rowsV.map(r => {
    const p = x => ((Math.max(r.d, Math.min(addDays(r.d, 1), x)) - r.d) / 864e5 * 100).toFixed(2) + '%';
    return `<div class="srow${r.today ? ' today' : ''}"><span class="sd">${r.today ? 'Сегодня' : WD[new Date(r.d).getDay()].slice(0, 2) + ' ' + new Date(r.d).getDate()}</span><div class="strip sm">${r.list.map(e => `<i class="sleep ${isNightNap(e) ? 'nt' : 'dy'}${e.e == null ? ' live' : ''}" style="left:${p(e.s)};width:calc(${p(e.e ?? now())} - ${p(e.s)})"></i>`).join('')}${r.today ? `<i class="nowl" style="left:${p(now())}"></i>` : ''}</div><span class="st2">${r.has ? fmtMin(r.tot).replace(' мин', 'м') : '—'}</span></div>`;
  }).join('')}<div class="srow ax"><span class="sd"></span><div class="strip-ax" style="flex:1"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div><span class="st2"></span></div></div><div class="lleg" style="margin:6px 0 0"><span><i style="background:var(--c-sleep)"></i>ночной сон</span><span><i class="dyk"></i>дневной сон</span></div></div>`;
  h += allSleeps();
  return h;
}

/* ───────── прогноз сна по истории ─────────
   Последние 14 дней: бодрствование после пробуждения в похожее время дня (±1,5 ч), длина снов в похожее время,
   время начала ночного сна — медианы (устойчивы к выбросам). Цепочка: проснётся → уснёт → … → ночной сон.
   Мало записей (меньше 6 снов) — нет прогноза, тогда ориентир по возрасту (nextSleepHint). */

/* ───────── скачки роста и «чудесные недели» ─────────
   Скачки роста (малыш чаще просит есть, беспокойнее; несколько дней): около 7–10 дней, 2–3 недель, 6 недель, 3 и 6 месяцев —
   по материалам WIC/USDA и консультантов по ГВ. «Чудесные недели» (van de Rijt, Plooij) — популярная книга, научных
   подтверждений мало: показываем мягко, с пометкой. Недели — от дня рождения (у недоношенных — от ПДР). */
const SPURTS = [[7, 10, '7–10 дней'], [14, 21, '2–3 недели'], [39, 45, '6 недель'], [84, 95, '3 месяца'], [175, 190, '6 месяцев']];
function spurtNow() { const b = birthTs(); if (b == null) return null; const d = Math.round((sod(now()) - b) / 864e5); return SPURTS.find(s => d >= s[0] - 1 && d <= s[1] + 1) || null; }
function viewSpurts() {
  const b = birthTs(); if (b == null) return needBirth('подсказывать про скачки роста');
  return leapTimeline();
}

  { from: 9, to: 12, ic: '⚽', name: 'Мяч туда-сюда', how: 'Сядьте напротив и катайте мяч друг другу. «Лови!»', dev: 'внимание, игра по очереди' },

function viewGames() {
  const am = monthsAt(now());
  const now_ = am == null ? GAMES : GAMES.filter(g => am >= g.from - 0.5 && am < g.to), rest = am == null ? [] : GAMES.filter(g => !now_.includes(g));
  const card = g => `<div class="card game"><h3>${g.ic} ${esc(g.name)}</h3><p class="st" style="margin:6px 0 4px">${esc(g.how)}</p><p class="hint">Развивает: ${esc(g.dev)} · ${g.from}–${g.to} мес.</p></div>`;
  let h = `<p class="hint" style="margin:0 0 12px">Лучшая игрушка для малыша — вы. Несколько минут, когда он бодр, сыт и в настроении; заскучал или отворачивается — пора отдохнуть.</p>`;
  h += now_.length ? `<div class="sec-t" style="margin-top:0">Сейчас подходят</div>${now_.map(card).join('')}` : '';
  if (rest.length) h += `<details class="ckp" style="margin-bottom:12px"><summary><b>Остальные игры</b><span class="vdate">${rest.length}</span></summary>${rest.map(card).join('')}</details>`;
  return h + `<p class="hint" style="margin:0 0 12px">По материалам CDC «Learn the Signs. Act Early» и Американской академии педиатрии (HealthyChildren.org).</p>`;
}

function settingsShare(me) {

    <div class="btns"><button class="b" onclick="gsLogin()">${G_ICON} Войти через Google</button></div>
    <p class="hint" style="margin:12px 0 6px">Вас пригласили в общий дневник?</p><div class="btns"><button class="b ghost" onclick="gsJoin('')">Открыть общий дневник</button></div>` + yb;
  const others = Object.entries(S.devs).filter(([k, d]) => k !== DEV && (d.name || d.email));
  return h + `<p class="hint" style="margin:0 0 10px">Вы вошли как <b>${esc(REMOTE.email)}</b>. Дневник хранится в таблице <a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(REMOTE.sheet)}" target="_blank" rel="noopener">«${GS_TITLE}»</a>.</p>
    <label class="f"><span>Как вас подписывать в дневнике</span><input id="s_me" value="${esc(me.name || '')}" placeholder="Мама, Папа, Бабушка…" autocomplete="off">${chipsHtml('me', [['Мама', 'Мама'], ['Папа', 'Папа']], me.name)}</label>
    ${others.length ? `<p class="hint" style="margin:0 0 10px">Ещё ведут дневник: <b>${others.map(([k, d]) => esc(d.name || d.email)).join(', ')}</b></p>` : ''}
    <label class="f"><span>Пригласить второго родителя — его почта Google</span><input id="s_inv" type="email" inputmode="email" placeholder="name@gmail.com" autocomplete="off"></label>
    <div class="err" id="s_ierr"></div>
    <div class="btns"><button class="b" id="s_invb" onclick="invite()">Пригласить</button><button class="b ghost" onclick="shareLink()">Отправить ссылку</button></div>
    <p class="hint" style="margin:8px 0 0">«Пригласить» открывает доступ и готовит письмо со ссылкой на дневник — останется нажать «Отправить». Ссылка работает только для тех, кого пригласили.</p>
    <div class="btns" style="margin-top:12px"><button class="b ghost" onclick="gsLogout()">Выйти из Google</button></div>`;
}

/* ───────── запуск ───────── */
function launch(act) {
  const q = new URLSearchParams(location.search), a = act || q.get('action'), j = act ? null : q.get('join');
  if (!a && !j) return;
  if (!act) history.replaceState(null, '', location.pathname);
  if (j) { if (REMOTE && REMOTE.sheet === j) toast('Вы уже ведёте этот общий дневник'); else openJoin(j); return; }
  if (a === 'sleep') toggleSleep();
  else if (a === 'feed') { const n = nextSide() || 'L'; if (!activeOf('feed')) breast(n); }
  else if (a === 'day') go('day');
  else if (a === 'docs') { UI.health = 'docs'; go('health'); }
  else if (a === 'chat') go('chat');
}
// ярлык Android, когда приложение уже открыто
window.babyAction = () => { let a = null; try { a = NATIVE && NATIVE.takeAction(); } catch (e) {} if (a) { closeSheet(); launch(a); } };
/* Android: вышла ли новая сборка. Выпуски — в открытом репозитории baby-diary-app (тег apk-<номер сборки>).
   Проверяем при запуске и при возвращении в приложение, не чаще раза в час; в настройках — «Проверить обновления». */
const APK_API = 'https://api.github.com/repos/tromb17/baby-diary-app/releases/latest';
function checkApk(force) {
  if (!NATIVE) return;
  if (!force && Date.now() - (+lsGet('babydiary.apkcheck') || 0) < 3600e3) return;
  // 404 — связь есть, но выпусков в baby-diary-app ещё нет (сборки уходят в закрытый репозиторий без секрета APP_TOKEN)
  fetch(APK_API, { cache: 'no-store' }).then(r => r.ok ? r.json() : r.status === 404 ? { none: true } : null).then(j => {
    if (j && j.none) { if (force) toast('На странице загрузки пока нет ни одной версии приложения'); return; }
    const n = j ? +((/^apk-(\d+)$/.exec(j.tag_name || '') || [])[1] || 0) : 0, have = +NATIVE.build() || 0, a = j && (j.assets || []).find(x => /\.apk$/i.test(x.name));
    if (n > have && a) { toast('Вышла новая версия приложения: 1.' + n, { label: 'Скачать', fn: () => NATIVE.openUrl(a.browser_download_url) }); return; }
    lsSet('babydiary.apkcheck', String(Date.now()));
    if (force) toast(j ? 'У вас последняя версия' : 'Не удалось проверить — нет связи с GitHub');
  }).catch(() => { if (force) toast('Не удалось проверить — нет связи с GitHub'); });
}
function boot() {
  applyInbox(); render(); launch(); setTimeout(phGc, 5000);
  if (NATIVE) { let a = null; try { a = NATIVE.takeAction(); } catch (e) {} if (a) launch(a); setTimeout(checkApk, 3000); }
  if (GAUTH_RET) {
    const g = GAUTH_RET; GAUTH_RET = null;
    if (g.p === 'y') { if (g.ok && g.first) ysSetup().catch(e => { setSync(REMOTE ? 'err' : 'off'); toast('Не удалось войти через Яндекс: ' + e.message); });
      else if (g.ok) sync(); else if (g.first) toast(g.err === 'access_denied' ? 'Вход отменён' : 'Не удалось войти через Яндекс'); else setSync('need'); }
    else if (g.ok && g.join) gsJoin(g.join);
    else if (g.ok && g.first) gsSetup().catch(e => { setSync(REMOTE ? 'err' : 'off'); toast('Не удалось войти: ' + e.message); });
    else if (g.ok) sync();
    else if (g.first || g.join) toast(g.err === 'access_denied' ? 'Вход отменён' : 'Не удалось войти в Google');
    else setSync('need');
  } else if (REMOTE) { gsAutoUntil = Date.now() + 8000; sync(); }
  setInterval(() => { if (!$('#sheetWrap').hidden) { tick(); return; } const n = isNight(); if (n !== document.documentElement.hasAttribute('data-night')) applyNight(); tick(); }, 1000);
  setInterval(() => { if ($('#sheetWrap').hidden) render(); }, 60000);
  // общий дневник: пока приложение открыто — забираем записи второго родителя раз в 30 секунд
  let tk = 0; setInterval(() => { tk++; if (REMOTE && !document.hidden && $('#sheetWrap').hidden && SYNC.st !== 'need' && (UI.tab === 'chat' || tk % 3 === 0)) sync(); }, 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !$('#sheetWrap').hidden) return;
    S = load(); applyInbox(); render();
    if (REMOTE) { gsAutoUntil = Date.now() + 8000; sync(); }

  });
  window.addEventListener('storage', e => { if (e.key === KEY && $('#sheetWrap').hidden) { S = load(); render(); } });
  if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
}
